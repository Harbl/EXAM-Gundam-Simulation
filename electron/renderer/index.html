<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>EXAM — Gundam TCG Sim</title>
<style>
  :root {
    --red: #9B1B1E;
    --red-glow: #d4282c;
    --grey: #333333;
    --black: #000000;
    --gold: #C9A951;
    --white: #FFFFFF;
    /* Warm parchment-grey used for body/field/button text -- stark #FFFFFF read as out of place
       against the brushed-metal/red/gold palette everywhere else, per Jake's feedback. */
    --text: #D6D0C2;
    --font-head: 'Bahnschrift', 'Arial Narrow', Impact, sans-serif;
    --font-body: 'Segoe UI', Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }

  /* Chromium/Electron honors webkit scrollbar pseudo-elements -- without this the native
     light-grey/white OS scrollbar shows up on every scrollable panel, textarea, and grid. */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #0a0a0a; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #4a4a4a, var(--grey)); border: 1px solid #000; }
  ::-webkit-scrollbar-thumb:hover { background: var(--red); }
  ::-webkit-scrollbar-corner { background: #0a0a0a; }

  /* Brushed-metal texture: a fine diagonal hairline pattern layered over a dark radial vignette,
     CSS-only (no image asset) -- same approach used for the panels/header below. */
  body {
    margin: 0;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 50% -10%, #1c1c1c 0%, #0a0a0a 45%, var(--black) 100%);
    color: var(--text);
    font-family: var(--font-body);
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  header {
    padding: 10px 20px;
    background: linear-gradient(180deg, #3a3a3a, var(--grey) 60%, #262626);
    border-bottom: 2px solid var(--red);
    box-shadow: 0 2px 10px -2px var(--red-glow);
    font-family: var(--font-head);
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  /* Original angular emblem mark (not the real Zeon crest) -- a gold diamond split by a chevron,
     evoking the reference style board's "angular insignia" iconography without reproducing it. */
  .emblem {
    width: 18px;
    height: 18px;
    background: var(--gold);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%, 50% 20%, 30% 50%, 50% 80%, 70% 50%);
    flex-shrink: 0;
  }
  header .status { color: var(--gold); letter-spacing: 2px; }
  .updateBanner {
    font-family: var(--font-head);
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: none;
    font-size: 12px;
    color: #000;
    background: var(--gold);
    border: none;
    border-radius: 4px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .updateBanner:hover { filter: brightness(1.1); }
  .updateBanner:disabled { cursor: default; filter: brightness(0.85); }
  .appBody { flex: 1; display: flex; min-height: 0; }
  nav {
    width: 150px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #161616, #0a0a0a);
    border-right: 2px solid var(--red);
    padding: 16px 0;
  }
  nav button {
    display: block;
    width: 100%;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    color: #999;
    font-family: var(--font-head);
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-size: 12px;
    text-align: left;
    padding: 12px 16px;
    cursor: pointer;
    clip-path: none;
    flex: none;
  }
  nav button:not(:disabled):hover { filter: none; color: var(--text); background: rgba(255,255,255,0.03); }
  nav button.active { color: var(--gold); border-left-color: var(--red); background: rgba(155,27,30,0.12); }
  main {
    flex: 1;
    display: flex;
    gap: 18px;
    padding: 20px;
    overflow: hidden;
    min-width: 0;
  }
  .screen { display: contents; }
  .screen.hidden { display: none; }
  .panel {
    flex: 1;
    background: linear-gradient(160deg, #151515, #0d0d0d);
    border: 1px solid var(--grey);
    border-left: 3px solid var(--red);
    box-shadow: -6px 0 16px -10px var(--red-glow) inset;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
    padding: 16px 18px;
    min-width: 0;
    position: relative;
    /* A panel's own content (e.g. a long replay timeline) now scrolls within the panel itself
       instead of growing past the viewport and forcing `main` to scroll as one unit, which used to
       drag the other panel along with it. */
    overflow-y: auto;
    overflow-x: hidden;
  }
  h2 {
    margin: 0 0 10px;
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--grey);
    padding-bottom: 7px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2::before {
    content: '';
    display: inline-block;
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 7px solid var(--red);
  }
  label {
    display: block;
    font-family: var(--font-head);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 12px 0 5px;
    color: #999;
  }
  textarea, input[type=number], input[type=text], select {
    width: 100%;
    background: #000;
    color: var(--text);
    border: 1px solid var(--grey);
    border-radius: 0;
    padding: 7px 8px;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea:focus, input[type=number]:focus, input[type=text]:focus, select:focus {
    border-color: var(--red);
    box-shadow: 0 0 6px -1px var(--red-glow);
  }
  select { appearance: none; cursor: pointer; }
  select option { background: #111; color: var(--text); }
  textarea { height: 160px; resize: vertical; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    filter: invert(1) brightness(0.65);
    cursor: pointer;
  }
  .skillRow { display: flex; gap: 12px; }
  .skillRow > div { flex: 1; }
  .buttons { display: flex; gap: 10px; margin-top: 14px; }
  button {
    flex: 1;
    padding: 11px;
    font-family: var(--font-head);
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 13px;
    border: none;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    cursor: pointer;
    transition: filter 0.1s;
  }
  button:not(:disabled):hover { filter: brightness(1.15); }
  button:not(:disabled):active { filter: brightness(0.9); }
  #runBtn { background: linear-gradient(180deg, #b8282c, var(--red) 70%); color: var(--text); }
  #runBtn:disabled { background: #3a1517; color: #755; cursor: not-allowed; }
  #cancelBtn { background: linear-gradient(180deg, #3a3a3a, #222); color: var(--text); border: 1px solid var(--grey); }
  #cancelBtn:disabled { color: #555; border-color: #222; background: #161616; cursor: not-allowed; }

  .progressTrack { background: #1a1a1a; border: 1px solid var(--grey); height: 14px; margin-top: 14px; overflow: hidden; }
  .progressFill {
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.15) 0px, rgba(255,255,255,0.15) 4px, transparent 4px, transparent 10px),
      linear-gradient(180deg, var(--red-glow), var(--red));
    height: 100%;
    width: 0%;
    transition: width 0.2s;
  }
  #progressText { font-family: 'Consolas', monospace; font-size: 11px; color: #999; margin-top: 6px; letter-spacing: 0.5px; text-align: center; }

  #runProgress { padding: 30px 0 6px; text-align: center; transition: opacity 0.5s ease; opacity: 1; }
  #results { transition: opacity 0.4s ease; opacity: 1; }
  .pulsingEmblem {
    width: 54px;
    height: 54px;
    margin: 0 auto;
    background: var(--gold);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%, 50% 20%, 30% 50%, 50% 80%, 70% 50%);
    animation: emblemPulse 1.4s ease-in-out infinite;
  }
  @keyframes emblemPulse {
    0%, 100% { opacity: 0.5; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  #results { font-size: 14.5px; }
  #results table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  #results th {
    font-family: var(--font-head);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--gold);
    border-bottom: 1px solid var(--red);
  }
  #results td, #results th { padding: 5px 8px; border-bottom: 1px solid var(--grey); text-align: left; }
  #results td { font-family: 'Consolas', monospace; }
  #results tr:nth-child(even) { background: rgba(255,255,255,0.02); }
  #error { color: var(--red-glow); font-weight: bold; margin-top: 10px; white-space: pre-wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.ready { background: #3ac13a; box-shadow: 0 0 5px #3ac13a; }
  .dot.busy { background: var(--gold); box-shadow: 0 0 5px var(--gold); }
  .dot.alert { background: var(--red-glow); box-shadow: 0 0 5px var(--red-glow); }

  .savedRow { display: flex; gap: 8px; margin-top: 8px; }
  .savedRow select { flex: 1; }

  /* Collapsing this down to a thin strip (instead of the old broken "fullscreen the board" attempt)
     is what actually gives the replay panel real room -- flex-basis shrinks to just the toggle
     button's width and the replay panel's own `flex: 2.2` picks up the freed space automatically. */
  #batchListPanel { flex: 1; }
  #batchListPanel.collapsed { flex: 0 0 auto; padding: 16px 10px; overflow: hidden; }
  #batchListPanel.collapsed h2 { border-bottom: none; padding-bottom: 0; }
  #batchListPanel.collapsed h2 span, #batchListPanel.collapsed #batchList { display: none; }

  .savedDeckList { margin-top: 6px; border: 1px solid var(--grey); }
  .savedDeckRow {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid #222; cursor: pointer; font-size: 14px;
  }
  .savedDeckRow:last-child { border-bottom: none; }
  .savedDeckRow:hover { background: #1a1a1a; }
  .savedDeckRow .rowLeft { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .savedDeckRow .savedDeckMeta { color: #777; font-size: 10.5px; margin-left: 6px; }
  .savedDeckColors { display: flex; gap: 4px; flex: none; }
  .colorDot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.5); }
  .savedDeckRow .deleteDeckBtn {
    flex: none; background: none; border: 1px solid #442; color: var(--red-glow);
    padding: 1px 7px; font-size: 12px; clip-path: none; cursor: pointer;
  }
  .savedDeckList .hint { padding: 8px; margin: 0; }

  .batchGameList { background: #0c0c0c; border-bottom: 1px solid #222; max-height: 220px; overflow-y: auto; }
  .batchGameRow {
    padding: 6px 12px 6px 24px; font-size: 12px; color: #ccc; cursor: pointer;
    border-bottom: 1px solid #1a1a1a; font-family: 'Consolas', monospace;
  }
  .batchGameRow:last-child { border-bottom: none; }
  .batchGameRow:hover { background: #1a1a1a; color: var(--gold); }
  .batchGameList .hint { padding: 6px 12px 6px 24px; margin: 0; font-size: 11px; }

  .smallBtn { flex: none !important; padding: 7px 14px !important; font-size: 11px !important; background: linear-gradient(180deg, #3a3a3a, #222); color: var(--text); border: 1px solid var(--grey); }

  .callouts { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 4px; }
  .callout { flex: 1; min-width: 100px; text-align: center; border: 1px solid var(--grey); border-top: 2px solid var(--gold); padding: 9px 4px; }
  .callout .num { font-family: var(--font-head); font-size: 26px; color: var(--gold); }
  .callout .lbl { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #aaa; }
  /* Smaller secondary row (games/draws/timeouts/game-length spread) -- these are single counts, not
     headline A-vs-B numbers, so they don't need the same visual weight as the top callout row. */
  .callouts.secondary { margin-top: 4px; }
  .callouts.secondary .callout { min-width: 76px; border-top-width: 1px; padding: 6px 4px; }
  .callouts.secondary .num { font-size: 17px; }
  .statLine { font-size: 14px; margin: 4px 0; }
  .chartLegend { display: flex; gap: 18px; font-size: 12.5px; color: #ccc; margin-top: 4px; }
  .chartLegend .swatch { display: inline-block; width: 11px; height: 11px; margin-right: 5px; vertical-align: -1px; }
  .swatchA { background: #c9383c; }
  .swatchB { background: var(--gold); }
  .smallStatus { font-size: 11.5px; color: var(--gold); margin-top: 4px; min-height: 14px; }
  .buttons.builderActions .smallBtn { flex: 1 !important; }

  #replaySection { border-top: 1px solid var(--grey); padding-top: 4px; }
  .timeline { margin-top: 10px; max-height: 260px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 11.5px; }
  .timeline .turn { color: var(--gold); font-family: var(--font-head); letter-spacing: 1px; margin-top: 8px; }
  .timeline .evt { display: flex; align-items: center; gap: 8px; padding: 3px 0 3px 10px; border-left: 2px solid var(--grey); }
  .timeline .evt.p0 { border-left-color: var(--red); }
  .timeline .evt.p1 { border-left-color: #4a90d9; }
  .timeline .evtThumb { width: 22px; height: 31px; object-fit: cover; background: #000; flex-shrink: 0; border: 1px solid #333; }
  .timeline .end { color: var(--gold); font-weight: bold; margin-top: 6px; }

  .viewToggle { display: flex; gap: 8px; margin: 10px 0 4px; flex: none; }
  .viewToggle button.active { border-color: var(--gold); color: var(--gold); }
  .playbackControls { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex: none; }
  .playbackControls input[type=range] { flex: 1; }
  #eventCaption { font-size: 11.5px; color: var(--gold); margin: 6px 0; min-height: 14px; flex: none; }

  /* Replay panel fills the full panel height (not a fixed px cap -- position:fixed "fullscreen" was
     tried and abandoned: .panel's own clip-path makes it a containing block for fixed descendants in
     Chromium, so a fixed overlay just gets clipped to the panel's own box instead of escaping it).
     #replaySection/#replayBoard/.board form a flex-column chain down to whichever view is active, so
     that view's own scrollable region gets 100% of the space between the toggle buttons above and the
     panel's bottom edge -- no separate fixed height to keep in sync with window resizes. */
  .replayPanel { display: flex; flex-direction: column; }
  .replayPanel > h2, .replayPanel > #replayHint { flex: none; }
  #replaySection { display: none; flex-direction: column; flex: 1; min-height: 0; }
  #replayTimeline { flex: 1; min-height: 0; overflow-y: auto; }
  #replayBoard { display: none; flex-direction: column; flex: 1; min-height: 0; }
  /* Side-by-side (not stacked) so both players' zones share the panel's full height instead of each
     needing their own half -- roughly halves the vertical room a hand/battle-area row needs to fit
     into before wrapping, which is what actually keeps both fully visible without scrolling. */
  .board { display: flex; flex-direction: row; gap: 10px; margin-top: 4px; font-size: 12px; flex: 1; min-height: 0; }
  .boardPlayer { border: 1px solid var(--grey); border-left: 2px solid transparent; padding: 8px; background: #0d0d0d; flex: 1; min-width: 0; overflow-y: auto; }
  .boardPlayer.active { border-left-color: var(--gold); }
  .boardPlayerHead {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-head); letter-spacing: 1px; color: var(--gold);
    text-transform: uppercase; font-size: 13px; margin-bottom: 8px;
  }
  .boardRow { margin-bottom: 9px; }
  .boardRow .rowLabel { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .boardTiles, .shieldRow, .handRow { display: flex; flex-wrap: wrap; gap: 7px; }
  .unitTile { width: 88px; background: #111; border: 1px solid var(--grey); padding: 4px; text-align: center; transition: opacity 300ms; }
  .unitTile.rested { opacity: 0.5; }
  .unitTile img { width: 76px; height: 107px; object-fit: cover; background: #000; display: block; margin: 0 auto 3px; }
  .unitTile .uName { font-size: 11px; line-height: 1.2; height: 26px; overflow: hidden; }
  .unitTile .hpTrack { background: #222; height: 6px; margin-top: 3px; }
  .unitTile .hpFill { background: var(--red-glow); height: 100%; transition: width 420ms ease; }
  .unitTile .pilotBadge { font-size: 10px; color: var(--gold); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .miniStat { font-size: 12px; color: #999; }
  .shieldBack { width: 34px; height: 48px; background: linear-gradient(160deg, #3a3a3a, #111); border: 1px solid var(--grey); flex-shrink: 0; }
  .shieldFront { width: 34px; height: 48px; flex-shrink: 0; }
  .shieldFront img { width: 34px; height: 48px; object-fit: cover; border: 1px solid var(--gold); display: block; }
  .handTile { width: 60px; flex-shrink: 0; }
  .handTile img { width: 60px; height: 84px; object-fit: cover; border: 1px solid var(--grey); display: block; }

  /* Full-motion board animation primitives -- everything is driven by JS (FLIP position/scale
     transforms via inline style, applied by flipFrom/animateExitTo in the script below) except three
     one-shot cues that are pure CSS @keyframes: a tile fading/scaling in on first appearance, fading/
     scaling out on generic removal, and a Shield's card-back-to-front reveal squeeze. */
  .enterAnim { animation: tileEnter 320ms ease-out; }
  @keyframes tileEnter { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
  .exitAnim { animation: tileExit 380ms ease-in forwards; pointer-events: none; }
  @keyframes tileExit { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.35); } }
  .shieldFlip { animation: shieldFlip 320ms ease-in-out; }
  @keyframes shieldFlip { 0% { transform: scaleX(1); } 50% { transform: scaleX(0.05); } 100% { transform: scaleX(1); } }
  .flashAttack { animation: flashAttack 380ms ease-out; }
  @keyframes flashAttack {
    0% { box-shadow: 0 0 0 0 rgba(155,27,30,0); transform: translateY(0); }
    30% { box-shadow: 0 0 14px 3px var(--red-glow); transform: translateY(-4px); }
    100% { box-shadow: 0 0 0 0 rgba(155,27,30,0); transform: translateY(0); }
  }
  .flashHit { animation: flashHit 380ms ease-out; }
  @keyframes flashHit { 0% { filter: none; } 25% { filter: brightness(2) saturate(2); } 100% { filter: none; } }
  .flashBlock { animation: flashBlock 420ms ease-out; }
  @keyframes flashBlock {
    0% { box-shadow: 0 0 0 0 rgba(74,144,217,0); }
    35% { box-shadow: 0 0 14px 4px #4a90d9; }
    100% { box-shadow: 0 0 0 0 rgba(74,144,217,0); }
  }

  .filterRow { display: flex; gap: 8px; margin-bottom: 10px; }
  .filterRow input { flex: 2; }
  .filterRow select { flex: 1; }
  .cardGrid { display: flex; flex-wrap: wrap; gap: 10px; max-height: 560px; overflow-y: auto; align-content: flex-start; }
  .cardGrid .hint { color: #777; font-size: 12px; }
  .cardTile { width: 108px; background: #111; border: 1px solid var(--grey); padding: 6px; text-align: center; }
  .cardTile img { width: 96px; height: 134px; object-fit: cover; background: #000; display: block; margin: 0 auto 4px; }
  .cardTile .name { font-size: 10.5px; font-weight: bold; line-height: 1.2; height: 24px; overflow: hidden; }
  .cardTile .meta { font-size: 9.5px; color: #999; margin: 2px 0 4px; }
  .cardTile .qtyRow { display: flex; align-items: center; justify-content: center; gap: 6px; }
  /* These had no background/color of their own, so they fell back to the native OS button face
     (light grey/white) instead of the theme -- same bug as the deckEntry steppers below, just never
     given the matching fix when the deckEntry version was styled. */
  .cardTile .qtyRow button {
    flex: none; padding: 2px 7px; font-size: 12px; clip-path: none;
    background: none; border: 1px solid var(--grey); color: #999; cursor: pointer;
  }
  .cardTile .qtyRow button:not(:disabled):hover { color: var(--gold); border-color: var(--gold); }
  .cardTile .qty { font-family: 'Consolas', monospace; min-width: 14px; }
  /* Expanded visual grid, not a compact text list -- each entry is a real card-art tile, same idea
     as .cardTile in the Browse Cards grid, just with a quantity readout + remove button instead of
     +/- steppers (quantity here comes from the Browse grid, an import, or a loaded saved deck). */
  .deckList { display: flex; flex-wrap: wrap; gap: 10px; max-height: 460px; overflow-y: auto; margin: 8px 0; align-content: flex-start; }
  .deckEntry { width: 100px; background: #111; border: 1px solid var(--grey); padding: 6px; text-align: center; }
  .deckEntry img { width: 88px; height: 123px; object-fit: cover; background: #000; display: block; margin: 0 auto 4px; }
  .deckEntry .entryName { display: block; font-size: 10.5px; font-weight: bold; line-height: 1.2; height: 24px; overflow: hidden; }
  .deckEntry .entryQty { display: block; font-size: 9px; color: #777; margin: 3px 0 1px; }
  /* +/- adjust the copy count without clearing the whole stack; x still removes every copy at once. */
  .deckEntry .qtyRow { display: flex; align-items: center; justify-content: center; gap: 3px; }
  .deckEntry .qtyRow .qty { font-family: 'Consolas', monospace; color: var(--gold); min-width: 12px; }
  .deckEntry .qtyRow button { flex: none; background: none; border: 1px solid var(--grey); color: #999; padding: 1px 6px; font-size: 11px; clip-path: none; cursor: pointer; }
  .deckEntry .entryRemove { color: var(--red-glow); border-color: #442; }
  #builderErrors { color: var(--red-glow); font-size: 11px; white-space: pre-wrap; }

  /* Shared hover-zoom preview -- both the Browse Cards grid and Your Deck grid wire their <img>s to
     this single fixed overlay on mouseenter/mousemove, since the in-grid thumbnails are too small to
     actually read a card's text. */
  .cardZoom {
    display: none;
    position: fixed;
    z-index: 500;
    pointer-events: none;
    border: 2px solid var(--gold);
    box-shadow: 0 0 24px rgba(0,0,0,0.85);
    background: #000;
  }
  .cardZoom img { display: block; width: 300px; height: 419px; object-fit: cover; }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="emblem"></span><span>EXAM // GUNDAM TCG SIM</span></div>
  <button id="updateBanner" class="updateBanner" style="display:none"></button>
  <div class="status"><span class="dot ready" id="statusDot"></span><span id="statusText">READY</span></div>
</header>

<div class="appBody">
<nav>
  <button id="navSimulate" class="active">Simulate</button>
  <button id="navBuilder">Deck Builder</button>
  <button id="navDecks">Saved Decks</button>
  <button id="navLog">Log</button>
</nav>
<main>
<div class="screen" id="simulateScreen">
  <div class="panel">
    <h2>Deck A</h2>
    <div class="savedRow">
      <select id="savedA"><option value="">Paste below, or load a saved deck...</option></select>
    </div>
    <div class="savedRow">
      <input type="text" id="nameA" placeholder="Deck name" />
      <button id="saveA" class="smallBtn">Save</button>
      <button id="exportA" class="smallBtn">Export Image</button>
    </div>
    <div id="statusA" class="smallStatus"></div>
    <textarea id="deckA" placeholder="4 GM ST01-005&#10;4 Guntank GD01-008&#10;..."></textarea>
    <h2 style="margin-top:16px">Deck B</h2>
    <div class="savedRow">
      <select id="savedB"><option value="">Paste below, or load a saved deck...</option></select>
    </div>
    <div class="savedRow">
      <input type="text" id="nameB" placeholder="Deck name" />
      <button id="saveB" class="smallBtn">Save</button>
      <button id="exportB" class="smallBtn">Export Image</button>
    </div>
    <div id="statusB" class="smallStatus"></div>
    <textarea id="deckB" placeholder="Paste the opposing decklist here"></textarea>
    <div class="skillRow">
      <div>
        <label for="skillA">Deck A piloting skill</label>
        <select id="skillA"></select>
      </div>
      <div>
        <label for="skillB">Deck B piloting skill</label>
        <select id="skillB"></select>
      </div>
    </div>
    <label for="games">Games to simulate</label>
    <input type="number" id="games" value="100" min="1" max="10000" />
    <div class="buttons">
      <button id="runBtn">Launch Simulation</button>
      <button id="cancelBtn" disabled>Cancel</button>
    </div>
  </div>

  <div class="panel">
    <h2>Results</h2>
    <div id="runProgress" style="display:none">
      <div class="pulsingEmblem"></div>
      <div class="progressTrack"><div class="progressFill" id="progressFill"></div></div>
      <div id="progressText"></div>
    </div>
    <div id="results">No batch run yet.</div>
    <div id="chartLegend" class="chartLegend" style="display:none">
      <span><span class="swatch swatchA"></span>Deck A</span>
      <span><span class="swatch swatchB"></span>Deck B</span>
    </div>
    <canvas id="statsChart" width="620" height="460" style="display:none; max-width:100%; margin-top:6px;"></canvas>
    <button id="exportStatsBtn" class="smallBtn" style="display:none; margin-top:10px;">Export Stats Infographic</button>
    <div id="exportStatus" class="smallStatus"></div>
    <div class="savedRow" id="saveBatchRow" style="display:none">
      <input type="text" id="batchNameInput" placeholder="Name this batch" />
      <button id="saveBatchBtn" class="smallBtn">Save Batch</button>
    </div>
    <div id="saveBatchStatus" class="smallStatus"></div>
    <div id="error"></div>
  </div>
</div>

<div class="screen hidden" id="builderScreen">
  <div class="panel" style="flex: 1.6">
    <h2>Your Deck</h2>
    <div class="savedRow">
      <select id="savedBuilder"><option value="">Load a saved deck to view/edit...</option></select>
    </div>
    <div id="deckTotal">0 / 50 cards</div>
    <div id="deckList" class="deckList"></div>
    <div id="builderErrors"></div>
    <label for="builderDeckName">Deck name</label>
    <input type="text" id="builderDeckName" placeholder="Deck name" />
    <label for="importText">Import a decklist paste</label>
    <textarea id="importText" style="height:70px" placeholder="4 GM ST01-005&#10;..."></textarea>
    <div class="buttons builderActions">
      <button id="importBtn" class="smallBtn">Import</button>
      <button id="saveBuilderBtn" class="smallBtn">Save Deck</button>
    </div>
    <div class="buttons builderActions">
      <button id="exportBuilderBtn" class="smallBtn">Export Image</button>
      <button id="clearBuilderBtn" class="smallBtn">Clear</button>
    </div>
    <div id="builderStatus" class="smallStatus"></div>
  </div>

  <div class="panel" style="flex: 1">
    <h2>Browse Cards</h2>
    <div class="filterRow">
      <input type="text" id="cardSearch" placeholder="Search name or number..." />
      <select id="filterColor"><option value="">Any color</option></select>
      <select id="filterLevel"><option value="">Any Lv.</option></select>
      <select id="filterCost"><option value="">Any Cost</option></select>
    </div>
    <div id="cardGrid" class="cardGrid"><p class="hint">Type a search term or pick a filter to browse the card database.</p></div>
  </div>
</div>

<div class="screen hidden" id="decksScreen">
  <div class="panel">
    <h2>Saved Decks</h2>
    <div id="savedDeckList" class="savedDeckList"></div>
  </div>
</div>

<div class="screen hidden" id="logScreen">
  <div class="panel" id="batchListPanel">
    <h2><span>Saved Batches</span><button id="collapseBatchListBtn" class="smallBtn" type="button" style="margin-left:auto">◀</button></h2>
    <div id="batchList" class="savedDeckList"></div>
  </div>
  <div class="panel replayPanel" style="flex: 2.2">
    <h2>Replay a Game</h2>
    <p id="replayHint" class="hint">Expand a saved batch on the left and pick a game to replay.</p>
    <div id="replaySection">
      <div class="viewToggle">
        <button id="logViewBtn" class="smallBtn active" type="button">Log View</button>
        <button id="boardViewBtn" class="smallBtn" type="button">Board View</button>
      </div>
      <div id="replayTimeline"></div>
      <div id="replayBoard">
        <div class="playbackControls">
          <button id="playbackPrev" class="smallBtn" type="button">◀ Prev</button>
          <button id="playbackPlay" class="smallBtn" type="button">Play</button>
          <button id="playbackNext" class="smallBtn" type="button">Next ▶</button>
          <input type="range" id="playbackScrub" min="0" max="0" value="0" />
        </div>
        <div id="eventCaption"></div>
        <div id="boardRoot" class="board"></div>
      </div>
    </div>
  </div>
</div>
</main>
</div>

<div id="cardZoom" class="cardZoom"><img id="cardZoomImg" alt="" /></div>

<script>
  const runBtn = document.getElementById('runBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const runProgress = document.getElementById('runProgress');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const resultsEl = document.getElementById('results');
  const errorEl = document.getElementById('error');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  function setStatus(mode, text) {
    statusDot.className = 'dot ' + mode;
    statusText.textContent = text;
  }

  function pct(x) { return (x * 100).toFixed(1) + '%'; }

  const skillASelect = document.getElementById('skillA');
  const skillBSelect = document.getElementById('skillB');
  const savedASelect = document.getElementById('savedA');
  const savedBSelect = document.getElementById('savedB');
  const statsChart = document.getElementById('statsChart');
  const chartLegend = document.getElementById('chartLegend');
  const exportStatsBtn = document.getElementById('exportStatsBtn');
  const exportStatusEl = document.getElementById('exportStatus');
  const replaySection = document.getElementById('replaySection');
  const replayTimeline = document.getElementById('replayTimeline');
  const replayHintEl = document.getElementById('replayHint');
  const saveBatchRow = document.getElementById('saveBatchRow');
  const batchNameInput = document.getElementById('batchNameInput');
  const saveBatchStatusEl = document.getElementById('saveBatchStatus');
  const saveBatchBtn = document.getElementById('saveBatchBtn');
  let lastStats = null;
  let lastContext = null;
  let fadeTimeout = null;

  runBtn.addEventListener('click', () => {
    const deckAText = document.getElementById('deckA').value;
    const deckBText = document.getElementById('deckB').value;
    const games = Number(document.getElementById('games').value) || 100;

    errorEl.textContent = '';
    resultsEl.innerHTML = '';
    resultsEl.style.opacity = '0';
    exportStatsBtn.style.display = 'none';
    exportStatusEl.textContent = '';
    saveBatchRow.style.display = 'none';
    batchNameInput.value = '';
    saveBatchStatusEl.textContent = '';
    lastStats = null;
    lastContext = null;
    clearTimeout(fadeTimeout);
    progressFill.style.width = '0%';
    progressText.textContent = '';
    runProgress.style.opacity = '1';
    runProgress.style.display = 'block';
    // Chart/legend show immediately (empty until the first progress tick) so the live bar-graph
    // preview reads as part of the same panel the progress bar is in, not a separate reveal later.
    chartLegend.style.display = 'flex';
    statsChart.style.display = 'block';
    const ctx = statsChart.getContext('2d');
    ctx.clearRect(0, 0, statsChart.width, statsChart.height);
    runBtn.disabled = true;
    cancelBtn.disabled = false;
    setStatus('busy', 'RUNNING');

    window.sim.run(deckAText, deckBText, games, skillASelect.value, skillBSelect.value);
  });

  cancelBtn.addEventListener('click', () => {
    window.sim.cancel();
    setStatus('alert', 'CANCELLED');
    runBtn.disabled = false;
    cancelBtn.disabled = true;
    runProgress.style.display = 'none';
    chartLegend.style.display = 'none';
    statsChart.style.display = 'none';
    resultsEl.style.opacity = '1';
    resultsEl.textContent = 'No batch run yet.';
  });

  window.sim.onProgress(({ completed, games, elapsedMs, live }) => {
    const fraction = completed / games;
    progressFill.style.width = (fraction * 100).toFixed(1) + '%';
    const etaMs = completed > 0 ? (elapsedMs / completed) * (games - completed) : 0;
    progressText.textContent =
      `${completed} / ${games} games — elapsed ${(elapsedMs / 1000).toFixed(1)}s — ETA ${(etaMs / 1000).toFixed(1)}s`;
    if (live) drawBarChart(statsChart, CHART_GROUPS(live), 13);
  });

  // Grouped horizontal bar chart, hand-rolled on <canvas> -- no charting dependency, matching this
  // project's established no-build-step/no-framework approach. Red bars = Deck A, gold = Deck B
  // (see the #chartLegend swatches in the markup, which use the same two colors).
  // Margin of victory is shields-remaining (0-6), not a 0-1 rate -- normalized by /6 so it can share
  // the same bar-area scale as every percentage row, with `fmt` overriding the printed value back to
  // the real shields-left number instead of a percentage.
  const CHART_GROUPS = (stats) => [
    { label: 'Win rate', a: stats.deckA.winRate, b: stats.deckB.winRate },
    { label: 'Decisive win', a: stats.deckA.decisiveWinRate, b: stats.deckB.decisiveWinRate },
    { label: 'Win when 1st', a: stats.deckA.winRateWhenFirst, b: stats.deckB.winRateWhenFirst },
    { label: 'Win when 2nd', a: stats.deckA.winRateWhenSecond, b: stats.deckB.winRateWhenSecond },
    {
      label: 'Margin (shields)', a: stats.deckA.marginOfVictory / 6, b: stats.deckB.marginOfVictory / 6,
      fmt: (v) => (v * 6).toFixed(1)
    },
    { label: 'Mulligan', a: stats.deckA.mulliganRate, b: stats.deckB.mulliganRate },
    { label: 'Turn 1 play', a: stats.deckA.turn1PlayRate, b: stats.deckB.turn1PlayRate },
    { label: 'Turn 2 play', a: stats.deckA.turn2PlayRate, b: stats.deckB.turn2PlayRate },
    { label: 'Turn 3 play', a: stats.deckA.turn3PlayRate, b: stats.deckB.turn3PlayRate }
  ];

  function drawBarChart(canvas, groups, fontSize) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.font = fontSize + 'px "Segoe UI", Arial, sans-serif';
    const rowH = h / groups.length;
    const labelW = fontSize * 9;
    const barAreaW = w - labelW - fontSize * 4.5;
    const barH = fontSize * 1.1;
    groups.forEach((g, i) => {
      const y = i * rowH;
      const format = g.fmt || pct;
      ctx.fillStyle = '#bbb';
      ctx.fillText(g.label, 4, y + rowH / 2 - barH * 0.3);
      const aw = Math.max(2, g.a * barAreaW);
      ctx.fillStyle = '#c9383c';
      ctx.fillRect(labelW, y + rowH * 0.14, aw, barH);
      ctx.fillStyle = '#D6D0C2';
      ctx.fillText(format(g.a), labelW + aw + 4, y + rowH * 0.14 + barH - 2);
      const bw = Math.max(2, g.b * barAreaW);
      ctx.fillStyle = '#C9A951';
      ctx.fillRect(labelW, y + rowH * 0.14 + barH + 3, bw, barH);
      ctx.fillStyle = '#D6D0C2';
      ctx.fillText(format(g.b), labelW + bw + 4, y + rowH * 0.14 + barH * 2 + 1);
    });
  }

  // Everything that used to be plain sentences (game length, went-first split, decisive win rate,
  // margin of victory) is now either a chart row (CHART_GROUPS above) or a small callout tile below --
  // per Jake's ask for the results panel to read as visual, not text.
  function renderResultsHtml(stats) {
    return `
      <div class="callouts">
        <div class="callout"><div class="num">${pct(stats.deckA.winRate)}</div><div class="lbl">Deck A win rate</div></div>
        <div class="callout"><div class="num">${pct(stats.deckB.winRate)}</div><div class="lbl">Deck B win rate</div></div>
        <div class="callout"><div class="num">${stats.averageTurns.toFixed(1)}</div><div class="lbl">Avg turns</div></div>
      </div>
      <div class="callouts secondary">
        <div class="callout"><div class="num">${stats.games}</div><div class="lbl">Games</div></div>
        <div class="callout"><div class="num">${stats.draws}</div><div class="lbl">Draws</div></div>
        <div class="callout"><div class="num">${stats.timeouts}</div><div class="lbl">Timeouts</div></div>
        <div class="callout"><div class="num">${stats.shortestGame}</div><div class="lbl">Shortest game</div></div>
        <div class="callout"><div class="num">${stats.medianGame}</div><div class="lbl">Median game</div></div>
        <div class="callout"><div class="num">${stats.longestGame}</div><div class="lbl">Longest game</div></div>
      </div>
    `;
  }

  window.sim.onResult(({ stats, context }) => {
    runBtn.disabled = false;
    cancelBtn.disabled = true;
    setStatus('ready', 'COMPLETE');
    lastStats = stats;
    lastContext = context;
    exportStatusEl.textContent = '';

    // Fade the pulsing emblem/progress bar out rather than snapping it away, so the finished stat
    // block reads as revealed underneath it, not as a jarring swap -- matches #runProgress's own
    // CSS transition. resultsEl.style.opacity was left at 0 by the run-start reset, so it fades in
    // as it's populated.
    runProgress.style.opacity = '0';
    fadeTimeout = setTimeout(() => { runProgress.style.display = 'none'; }, 500);
    resultsEl.innerHTML = renderResultsHtml(stats);
    resultsEl.style.opacity = '1';

    chartLegend.style.display = 'flex';
    statsChart.style.display = 'block';
    drawBarChart(statsChart, CHART_GROUPS(stats), 13);
    exportStatsBtn.style.display = 'inline-block';

    // Replaying/browsing individual games now lives entirely on the Log page, against saved
    // batches -- so the only thing offered here is a way to save this batch to get there.
    const hasGames = stats.perGame && stats.perGame.length > 0;
    saveBatchRow.style.display = hasGames ? 'flex' : 'none';
  });

  window.sim.onError((message) => {
    runBtn.disabled = false;
    cancelBtn.disabled = true;
    runProgress.style.display = 'none';
    setStatus('alert', 'ERROR');
    resultsEl.style.opacity = '1';
    resultsEl.textContent = 'No batch run yet.';
    chartLegend.style.display = 'none';
    statsChart.style.display = 'none';
    exportStatsBtn.style.display = 'none';
    saveBatchRow.style.display = 'none';
    errorEl.textContent = message;
  });

  saveBatchBtn.addEventListener('click', async () => {
    const name = batchNameInput.value.trim();
    if (!name) { batchNameInput.focus(); return; }
    if (!lastStats || !lastContext) return;
    await window.resultsStore.save(name, lastStats, lastContext);
    saveBatchStatusEl.textContent = `Saved "${name}".`;
  });

  // --- Saved decks (Deck A / Deck B panels) ---
  async function refreshSavedDecks() {
    if (!window.deckStore) return;
    const decks = await window.deckStore.list();
    const targets = [
      { select: savedASelect, placeholder: 'Paste below, or load a saved deck...' },
      { select: savedBSelect, placeholder: 'Paste below, or load a saved deck...' },
      { select: savedBuilderSelect, placeholder: 'Load a saved deck to view/edit...' }
    ];
    for (const { select, placeholder } of targets) {
      const current = select.value;
      select.innerHTML = `<option value="">${placeholder}</option>`;
      for (const d of decks) select.appendChild(new Option(d.name, d.name));
      select.value = current;
    }
    await renderSavedDeckList(decks);
  }

  // Same 5 game colors card data uses (src/deck/validator.js's colorCounts keys, lowercase full
  // words) -- a small display-only accent, not derived from the app's own Zeon red/gold theme colors.
  const GAME_COLOR_HEX = { blue: '#3d7dca', green: '#4f9c4f', red: '#c0392b', white: '#e8e4d8', purple: '#8e5bc4' };

  // Saved Decks page: click a row to open it in the Deck Builder for viewing/editing, click x to
  // delete it. Kept on its own nav page rather than embedded in the Deck Builder panel so it doesn't
  // compete for space there -- the Deck Builder's own dropdown is still there for a quick in-place
  // swap while already editing.
  async function renderSavedDeckList(decks) {
    savedDeckListEl.innerHTML = '';
    if (!decks.length) {
      savedDeckListEl.innerHTML = '<p class="hint">No saved decks yet.</p>';
      return;
    }
    // validateDeck (behind window.cards.validate) already computes colorCounts for the deck-color-count
    // legality rule -- reused here rather than re-deriving color info from the card DB separately.
    const withColors = await Promise.all(decks.map(async (d) => {
      const result = window.cards ? await window.cards.validate(d.decklistText) : null;
      const colorCounts = (result && result.colorCounts) || {};
      const colors = Object.keys(colorCounts).sort((a, b) => colorCounts[b] - colorCounts[a]);
      return { deck: d, colors };
    }));
    // Built via DOM methods (not innerHTML string interpolation) since deck names are user-typed free
    // text -- same .textContent-over-innerHTML rule the rest of this app follows for user input.
    for (const { deck: d, colors } of withColors) {
      const row = document.createElement('div');
      row.className = 'savedDeckRow';
      const rowLeft = document.createElement('div');
      rowLeft.className = 'rowLeft';
      const label = document.createElement('span');
      label.textContent = d.name;
      const meta = document.createElement('span');
      meta.className = 'savedDeckMeta';
      meta.textContent = new Date(d.savedAt).toLocaleDateString();
      label.appendChild(meta);
      const colorWrap = document.createElement('span');
      colorWrap.className = 'savedDeckColors';
      for (const color of colors) {
        const dot = document.createElement('span');
        dot.className = 'colorDot';
        dot.style.background = GAME_COLOR_HEX[color] || '#666';
        dot.title = color[0].toUpperCase() + color.slice(1);
        colorWrap.appendChild(dot);
      }
      rowLeft.append(label, colorWrap);
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'deleteDeckBtn';
      delBtn.title = 'Delete this deck';
      delBtn.textContent = '×';
      row.append(rowLeft, delBtn);
      row.addEventListener('click', () => {
        showScreen('builder');
        initBuilderOnce();
        loadSavedDeckIntoBuilder(d.name);
      });
      delBtn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        await window.deckStore.delete(d.name);
        refreshSavedDecks();
      });
      savedDeckListEl.appendChild(row);
    }
  }

  // --- Log page: saved batches, expandable to a per-game list, click a game to replay it full-page ---
  const batchListEl = document.getElementById('batchList');
  const MAX_RENDERED_GAMES = 500;

  async function refreshSavedBatches() {
    if (!window.resultsStore) return;
    const batches = await window.resultsStore.list();
    renderBatchList(batches);
  }

  function buildGameRows(container, batch) {
    const perGame = batch.stats.perGame || [];
    const shown = perGame.slice(0, MAX_RENDERED_GAMES);
    shown.forEach((g, i) => {
      const gRow = document.createElement('div');
      gRow.className = 'batchGameRow';
      const outcome = g.draw ? 'Draw' : g.timedOut ? 'Timed out' : `P${g.winner} won`;
      gRow.textContent = `#${i + 1} — ${outcome} — ${Math.ceil(g.turns / 2)} turns`;
      gRow.addEventListener('click', (ev) => {
        ev.stopPropagation();
        viewReplay(g.seed, batch.context);
      });
      container.appendChild(gRow);
    });
    if (perGame.length > MAX_RENDERED_GAMES) {
      const hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = `...and ${perGame.length - MAX_RENDERED_GAMES} more -- narrow this down by saving smaller batches.`;
      container.appendChild(hint);
    }
  }

  function renderBatchList(batches) {
    batchListEl.innerHTML = '';
    if (!batches.length) {
      batchListEl.innerHTML = '<p class="hint">No saved batches yet -- run one on the Simulate screen and save it.</p>';
      return;
    }
    for (const b of batches) {
      const row = document.createElement('div');
      row.className = 'savedDeckRow';
      const rowLeft = document.createElement('div');
      rowLeft.className = 'rowLeft';
      const label = document.createElement('span');
      label.textContent = b.name;
      const meta = document.createElement('span');
      meta.className = 'savedDeckMeta';
      meta.textContent =
        `${new Date(b.savedAt).toLocaleDateString()} — ${b.stats.games} games — ` +
        `A ${pct(b.stats.deckA.winRate)} / B ${pct(b.stats.deckB.winRate)}`;
      label.appendChild(meta);
      rowLeft.appendChild(label);
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'deleteDeckBtn';
      delBtn.title = 'Delete this batch';
      delBtn.textContent = '×';
      row.append(rowLeft, delBtn);

      // Game rows are built lazily on first expand, not up front for every saved batch -- a batch can
      // carry up to MAX_RENDERED_GAMES worth of DOM nodes, no need to pay that for every collapsed row.
      const gamesList = document.createElement('div');
      gamesList.className = 'batchGameList';
      gamesList.style.display = 'none';
      row.addEventListener('click', () => {
        const showing = gamesList.style.display !== 'none';
        gamesList.style.display = showing ? 'none' : 'block';
        if (!showing && !gamesList.dataset.built) {
          buildGameRows(gamesList, b);
          gamesList.dataset.built = '1';
        }
      });
      delBtn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        await window.resultsStore.delete(b.name);
        refreshSavedBatches();
      });

      const wrap = document.createElement('div');
      wrap.append(row, gamesList);
      batchListEl.appendChild(wrap);
    }
  }

  const batchListPanel = document.getElementById('batchListPanel');
  const collapseBatchListBtn = document.getElementById('collapseBatchListBtn');
  collapseBatchListBtn.addEventListener('click', () => {
    const collapsed = batchListPanel.classList.toggle('collapsed');
    collapseBatchListBtn.textContent = collapsed ? '▶' : '◀';
  });

  const nameAInput = document.getElementById('nameA');
  const nameBInput = document.getElementById('nameB');

  savedASelect.addEventListener('change', async () => {
    if (!savedASelect.value) return;
    const deck = await window.deckStore.load(savedASelect.value);
    if (deck) {
      document.getElementById('deckA').value = deck.decklistText;
      nameAInput.value = deck.name;
    }
  });
  savedBSelect.addEventListener('change', async () => {
    if (!savedBSelect.value) return;
    const deck = await window.deckStore.load(savedBSelect.value);
    if (deck) {
      document.getElementById('deckB').value = deck.decklistText;
      nameBInput.value = deck.name;
    }
  });
  // Electron's renderer does not implement window.prompt() (it throws "prompt() is and will not be
  // supported") -- these used to silently fail on click for exactly that reason. Named inputs next
  // to each Save button replace it.
  document.getElementById('saveA').addEventListener('click', async () => {
    const name = nameAInput.value.trim();
    if (!name) { nameAInput.focus(); return; }
    await window.deckStore.save(name, document.getElementById('deckA').value);
    refreshSavedDecks();
  });
  document.getElementById('saveB').addEventListener('click', async () => {
    const name = nameBInput.value.trim();
    if (!name) { nameBInput.focus(); return; }
    await window.deckStore.save(name, document.getElementById('deckB').value);
    refreshSavedDecks();
  });

  // --- Replay viewer ---
  function eventDescription(e) {
    switch (e.type) {
      case 'deploy': return `P${e.player} deploys ${e.card.name} (${e.card.number})`;
      case 'deployBase': return `P${e.player} deploys Base ${e.card.name} (${e.card.number})`;
      case 'command': return `P${e.player} plays ${e.card.name} (${e.card.number})`;
      case 'pair': return `P${e.player} pairs ${e.pilot.name} onto ${e.unit.name}`;
      case 'pairFromTrash': return `P${e.player} pairs ${e.pilot.name} (from trash) onto ${e.unit.name}`;
      case 'attack': {
        const targetDesc = e.target.type === 'player' ? `P${e.target.player} (face)` : e.target.unit.name;
        return `P${e.player}'s ${e.attacker.name} attacks ${targetDesc}`;
      }
      case 'draw': return `P${e.player} draws a card${e.isPhaseDraw ? '' : ' (effect)'}`;
      case 'resource': return `P${e.player} places a Resource`;
      case 'burst': return `P${e.player}'s shield reveals ${e.card.name} (${e.card.number})${e.activated ? ' — Burst activated' : ''}`;
      case 'block': return `P${e.player}'s ${e.blocker.name} blocks, intercepting ${e.attacker.name}`;
      default: return null;
    }
  }

  // The card whose art best represents this event, for the small inline thumbnail -- the actual
  // card played/deployed for most event types, the attacking unit for an attack (not the target,
  // to keep one thumbnail per row instead of two).
  function eventCardNumber(e) {
    switch (e.type) {
      case 'deploy': case 'deployBase': case 'command': return e.card.number;
      case 'pair': case 'pairFromTrash': return e.pilot.number;
      case 'block': return e.blocker.number;
      case 'attack': return e.attacker.number;
      case 'burst': return e.card.number;
      default: return null;
    }
  }

  function renderTimeline(events) {
    let html = '';
    for (const e of events) {
      // Mulligan decisions happen during setup, before the first real turn -- rendered as setup
      // notes (same styling as the gameStart line right after them), not as a per-turn .evt row.
      if (e.type === 'mulligan') {
        html += `<div class="turn">P${e.player} ${e.mulliganed ? 'mulligans' : 'keeps their opening hand'}</div>`;
        continue;
      }
      if (e.type === 'gameStart') { html += `<div class="turn">First player: P${e.firstPlayer}</div>`; continue; }
      // e.turn is the engine's raw per-player-turn counter (1=P0, 2=P1, 3=P0, 4=P1, ...), not a
      // round number -- displaying it directly reads like turns are being skipped (Jake asked
      // exactly this after a replay showed "Turn 2"/"Turn 3" as two different players' turns).
      // Round = ceil(turn/2) makes both players' turns within the same round share one number.
      if (e.type === 'turnStart') {
        html += `<div class="turn">Round ${Math.ceil(e.turn / 2)} — P${e.player}'s turn</div>`;
        continue;
      }
      if (e.type === 'gameEnd') {
        const outcome = e.draw ? 'Draw' : e.timedOut ? 'Timed out' : `P${e.winner} wins`;
        html += `<div class="end">${outcome} (round ${Math.ceil(e.turns / 2)})</div>`;
        continue;
      }
      const desc = eventDescription(e);
      if (!desc) continue;
      const number = eventCardNumber(e);
      const thumb = number
        ? `<img class="evtThumb" data-number="${number}" src="${imgSrcFor(number)}" onerror="this.style.visibility='hidden'" />`
        : '<span class="evtThumb"></span>';
      html += `<div class="evt p${e.player}">${thumb}<span>${desc}</span></div>`;
    }
    replayTimeline.innerHTML = `<div class="timeline">${html}</div>`;
    for (const img of replayTimeline.querySelectorAll('.evtThumb[data-number]')) {
      wireHoverZoom(img, img.dataset.number);
    }
  }

  // --- Board View: a client-side reducer that replays the event log up to some index into a
  // display-only snapshot (hands, shields, battle areas, HP), and a persistent, keyed-DOM renderer
  // that turns single-step-forward transitions into real motion (a deployed Unit visibly flies from
  // the hand zone into the battle area, a destroyed Unit flies into the trash counter, etc.) via the
  // classic FLIP technique (measure position before a DOM mutation, apply the mutation, then animate
  // from the old position/size to the new one). Every trackable entity (a hand card, a battle-area
  // Unit/Base, a face-down Shield slot) gets a stable `_key`, derived from the event that created it
  // so the SAME key is produced every time buildSnapshot replays the same event range -- this is what
  // lets the renderer recognize "this hand card is the same physical object as that new Unit tile"
  // across two consecutive steps and reuse (move) its actual DOM node instead of destroying and
  // recreating it. Jumping via Prev/scrubber does a plain instant rebuild (no prior DOM state to
  // sensibly animate from); only advancing exactly one event forward (Next/Play) animates.
  function removeFromHandByNumber(hand, number) {
    const idx = hand.findIndex((c) => c.number === number);
    if (idx !== -1) hand.splice(idx, 1);
  }

  function newUnit(unitRef) {
    return { id: unitRef.id, number: unitRef.number, name: unitRef.name, damage: 0, rested: false, pilot: null, _key: 'unit-' + unitRef.id };
  }

  function buildSnapshot(events, uptoIdx) {
    const players = [0, 1].map(() => ({
      hand: [], shieldCount: 6, base: null, battleArea: [], resourceCount: 0, trashCount: 0, pendingBaseReveal: false
    }));
    let activePlayer = null;
    for (let i = 0; i <= uptoIdx && i < events.length; i++) {
      const e = events[i];
      const p = e.player !== undefined ? players[e.player] : null;
      switch (e.type) {
        case 'openingHand':
          players[e.player].hand.push(...e.hand.map((c, idx) => ({ ...c, _key: `hand-${e.player}-${i}-${idx}` })));
          break;
        case 'gameStart': activePlayer = e.firstPlayer; break;
        // 5-17-3: both players start the game with an EX Base already in play (see traceGame.js's
        // matching comment for why this needs its own event, distinct from 'deployBase').
        case 'baseSetup': p.base = newUnit(e.base); break;
        case 'turnStart': {
          activePlayer = e.player;
          // Start-phase active step: only the turn's own player untaps their Units/Base -- this is
          // also what clears a Blocker's rested state after it intercepted an attack on an earlier turn.
          for (const u of p.battleArea) u.rested = false;
          if (p.base) p.base.rested = false;
          break;
        }
        case 'draw': p.hand.push({ ...e.card, _key: `hand-${e.player}-${i}` }); break;
        case 'resource': p.resourceCount++; break;
        case 'deploy':
          removeFromHandByNumber(p.hand, e.card.number);
          p.battleArea.push(newUnit(e.unit));
          break;
        case 'deployBase':
          // A becomeBase-driven deployBase (see the 'burst' case below) does NOT come from hand --
          // removing by card number here would be wrong whenever a second copy of the same Base
          // happens to be sitting in hand at the same time (real case: Jake's deck runs 2x Jaburo,
          // one can be a Shield while the other is still in hand). p.pendingBaseReveal, set by the
          // burst that triggered this, is the actual origin signal, not a same-number hand guess.
          if (p.pendingBaseReveal) p.pendingBaseReveal = false;
          else removeFromHandByNumber(p.hand, e.card.number);
          if (p.base) p.trashCount++;
          p.base = newUnit(e.unit);
          break;
        case 'command':
          removeFromHandByNumber(p.hand, e.card.number);
          p.trashCount++;
          break;
        case 'pair':
        case 'pairFromTrash': {
          if (e.type === 'pair') removeFromHandByNumber(p.hand, e.pilot.number);
          const unit = p.battleArea.find((u) => u.id === e.unit.id) || (p.base && p.base.id === e.unit.id ? p.base : null);
          if (unit) unit.pilot = { number: e.pilot.number, name: e.pilot.name };
          break;
        }
        case 'attack': {
          const unit = p.battleArea.find((u) => u.id === e.attacker.id);
          if (unit) unit.rested = true;
          players[0].shieldCount = e.shieldsAfter[0];
          players[1].shieldCount = e.shieldsAfter[1];
          break;
        }
        case 'block': {
          // e.player is the blocker's own controller (the defending side) -- traceGame.js's chooseBlocker
          // wrapper reports state.players.indexOf(defendingPlayer), not the attacker's side.
          const blockerUnit = p.battleArea.find((u) => u.id === e.blocker.id);
          if (blockerUnit) blockerUnit.rested = true;
          break;
        }
        case 'burst':
          // The Shield's real fate (hand / becomes-a-Base / trash) is resolved by the renderer's own
          // key-transition logic (applyKeyTransition below), keyed off this same event -- the snapshot
          // only needs shieldCount to drop the instant the Shield is revealed (it leaves the row right
          // then, not later when the enclosing attack event's shieldsAfter eventually confirms it;
          // that later overwrite is still authoritative and just re-applies the same value) and the
          // revealed card to land in hand when that's genuinely its fate.
          p.shieldCount = Math.max(0, p.shieldCount - 1);
          if (e.endedUpInHand) {
            p.hand.push({ ...e.card, _key: `hand-${e.player}-${i}` });
          } else {
            // Every Base card's Burst text converts the Shield straight into that player's Base
            // (becomeBase -- e.g. Jaburo, White Base, Archangel; grep-confirmed 68/68 Base cards work
            // this way, not just Jaburo). That case is handled by the 'deployBase' event traceGame.js
            // now emits from becomeBase, so it must NOT be double-counted into trash here. Any other
            // (non-Base) Burst that doesn't end up in hand really does go to trash.
            const def = cardByNumber(e.card.number);
            if (def && def.type === 'base') p.pendingBaseReveal = true; // consumed by the deployBase above
            else p.trashCount++;
          }
          break;
        case 'damage': {
          const unit = p.battleArea.find((u) => u.id === e.instance.id) || (p.base && p.base.id === e.instance.id ? p.base : null);
          if (unit) unit.damage += e.amount;
          break;
        }
        case 'destroy': {
          const idx = p.battleArea.findIndex((u) => u.id === e.unit.id);
          if (idx !== -1) p.battleArea.splice(idx, 1);
          else if (p.base && p.base.id === e.unit.id) p.base = null;
          p.trashCount++;
          break;
        }
        case 'discard':
          removeFromHandByNumber(p.hand, e.card.number);
          p.trashCount++;
          break;
      }
    }
    return { players, activePlayer, event: events[uptoIdx] || null };
  }

  function eventCaptionText(e) {
    if (!e) return 'Start of game';
    const desc = eventDescription(e);
    if (desc) return desc;
    switch (e.type) {
      case 'mulligan': return `P${e.player} ${e.mulliganed ? 'mulligans' : 'keeps their opening hand'}`;
      case 'openingHand': return `P${e.player}'s opening hand is set`;
      case 'baseSetup': return `P${e.player}'s EX Base is placed`;
      case 'gameStart': return `First player: P${e.firstPlayer}`;
      case 'turnStart': return `Round ${Math.ceil(e.turn / 2)} — P${e.player}'s turn`;
      case 'destroy': return `P${e.player}'s ${e.unit.name} is destroyed`;
      case 'damage': return `P${e.player}'s ${e.instance.name} takes ${e.amount} damage`;
      case 'discard': return `P${e.player} discards ${e.card.name} (hand limit)`;
      case 'gameEnd': return e.draw ? 'Draw' : e.timedOut ? 'Timed out' : `P${e.winner} wins`;
      default: return e.type;
    }
  }

  // --- Persistent keyed DOM + FLIP animation ---
  const boardRootEl = document.getElementById('boardRoot');
  let boardZones = null; // [{root,label,counts,shieldsEl,baseEl,battleEl,handEl}, ...] built once per replay
  let boardNodeRegistry = new Map(); // stable _key -> the one persistent element representing it

  function ensureBoardSkeleton() {
    if (boardZones) return;
    boardRootEl.innerHTML = [0, 1].map((i) => `
      <div class="boardPlayer" data-player="${i}">
        <div class="boardPlayerHead"><span class="playerLabel"></span><span class="playerCounts"></span></div>
        <div class="boardRow"><div class="rowLabel">Shields</div><div class="shieldRow boardTiles" data-zone="shields"></div></div>
        <div class="boardRow"><div class="rowLabel">Base</div><div class="boardTiles" data-zone="base"></div></div>
        <div class="boardRow"><div class="rowLabel">Battle Area</div><div class="boardTiles" data-zone="battle"></div></div>
        <div class="boardRow"><div class="rowLabel">Hand</div><div class="handRow boardTiles" data-zone="hand"></div></div>
      </div>`).join('');
    boardZones = [0, 1].map((i) => {
      const root = boardRootEl.children[i];
      return {
        root,
        label: root.querySelector('.playerLabel'),
        counts: root.querySelector('.playerCounts'),
        shieldsEl: root.querySelector('[data-zone="shields"]'),
        baseEl: root.querySelector('[data-zone="base"]'),
        battleEl: root.querySelector('[data-zone="battle"]'),
        handEl: root.querySelector('[data-zone="hand"]')
      };
    });
  }

  function resetBoard() {
    boardNodeRegistry.clear();
    boardZones = null;
    boardRootEl.innerHTML = '';
  }

  // Builds (or, for a role change, rebuilds) an element's actual markup for its current role. Only
  // called on first creation or when a re-keyed element is taking on a new shape (e.g. a hand card
  // becoming a battle-area Unit) -- everyday updates to an unchanged role go through refreshTile
  // instead, which only touches the specific sub-nodes that changed so their own CSS transitions
  // (HP bar width, rested opacity) actually have an old value to animate from.
  function setTileRole(el, role, item, cardDef) {
    el.dataset.role = role;
    if (role === 'shieldBack') {
      el.className = 'shieldBack';
      el.innerHTML = '';
      return;
    }
    if (role === 'hand') {
      el.className = 'handTile';
      el.dataset.number = item.number;
      el.innerHTML = `<img src="${imgSrcFor(item.number)}" onerror="this.style.visibility='hidden'" />`;
      wireHoverZoom(el.querySelector('img'), item.number);
      return;
    }
    // role === 'unit' (Battle Area member or Base)
    el.className = 'unitTile' + (item.rested ? ' rested' : '');
    el.dataset.number = item.number;
    const maxHp = cardDef ? cardDef.hp : null;
    el.innerHTML = `
      <img src="${imgSrcFor(item.number)}" onerror="this.style.visibility='hidden'" />
      <div class="uName">${item.name}</div>
      ${maxHp ? `<div class="hpTrack"><div class="hpFill" style="width:100%"></div></div><div class="miniStat">${maxHp}/${maxHp} HP</div>` : ''}
    `;
    wireHoverZoom(el.querySelector('img'), item.number);
    refreshTile(el, role, item, cardDef);
  }

  function refreshTile(el, role, item, cardDef) {
    if (role !== 'unit') return;
    el.classList.toggle('rested', !!item.rested);
    const maxHp = cardDef ? cardDef.hp : null;
    if (maxHp) {
      const remaining = Math.max(0, maxHp - item.damage);
      const pct = Math.max(0, Math.min(100, (remaining / maxHp) * 100));
      const fill = el.querySelector('.hpFill');
      if (fill) fill.style.width = pct + '%';
      const stat = el.querySelector('.miniStat');
      if (stat) stat.textContent = `${remaining}/${maxHp} HP`;
    }
    let badge = el.querySelector('.pilotBadge');
    if (item.pilot) {
      if (!badge) { badge = document.createElement('div'); badge.className = 'pilotBadge'; el.appendChild(badge); }
      badge.textContent = '+ ' + item.pilot.name;
    } else if (badge) {
      badge.remove();
    }
  }

  // Reconciles one zone's DOM children against its current items list: reuses (updates or, on a role
  // change, rebuilds) each item's persistent element by key, creates one for a genuinely new key
  // (with an enter animation, only when `animate`), and always appendChild's every item in list order
  // -- appendChild on an already-present child just reorders it, so this also keeps zone order correct
  // for free. Returns the set of keys it rendered, so the caller can tell which registry entries were
  // NOT claimed by anything this step (those departed and need an exit animation).
  function reconcileZone(container, items, role, cardDefFn, animate) {
    const seen = new Set();
    for (const item of items) {
      const key = item._key;
      seen.add(key);
      const cardDef = cardDefFn ? cardDefFn(item) : null;
      let el = boardNodeRegistry.get(key);
      if (!el) {
        el = document.createElement('div');
        boardNodeRegistry.set(key, el);
        setTileRole(el, role, item, cardDef);
        if (animate) {
          el.classList.add('enterAnim');
          el.addEventListener('animationend', () => el.classList.remove('enterAnim'), { once: true });
        }
      } else if (el.dataset.role !== role) {
        setTileRole(el, role, item, cardDef);
      } else {
        refreshTile(el, role, item, cardDef);
      }
      container.appendChild(el);
    }
    return seen;
  }

  function findVanishedKey(prevList, newList) {
    const newKeys = new Set(newList.map((c) => c._key));
    const vanished = prevList.find((c) => !newKeys.has(c._key));
    return vanished ? vanished._key : null;
  }

  // Moves a still-live entity from one key to another without touching the DOM -- reconcileZone will
  // discover it under its new key next, see its role doesn't match yet, and rebuild its content/class
  // for the new role while FLIP (driven separately, from the rect captured before any of this ran)
  // carries it visually from its old position to wherever reconcileZone parents it.
  function rekey(oldKey, newKey) {
    if (!oldKey) return;
    const el = boardNodeRegistry.get(oldKey);
    if (!el) return;
    boardNodeRegistry.delete(oldKey);
    boardNodeRegistry.set(newKey, el);
  }

  // A departing entity with a real destination on screen (the trash counter, or the Unit it's pairing
  // onto) -- unlike rekey, nothing will claim this element again, so it's removed from the registry
  // immediately and animates itself out independently of the zone reconciliation happening this step.
  function animateExitTo(el, targetEl, scale) {
    const before = el.getBoundingClientRect();
    const targetRect = targetEl ? targetEl.getBoundingClientRect() : before;
    const dx = targetRect.left + targetRect.width / 2 - (before.left + before.width / 2);
    const dy = targetRect.top + targetRect.height / 2 - (before.top + before.height / 2);
    el.style.transition = 'none';
    el.style.zIndex = '50';
    requestAnimationFrame(() => {
      el.style.transition = 'transform 380ms ease-in, opacity 380ms ease-in';
      el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
      el.style.opacity = '0';
    });
    setTimeout(() => el.remove(), 420);
  }

  function exitToward(key, player) {
    if (!key) return;
    const el = boardNodeRegistry.get(key);
    if (!el) return;
    boardNodeRegistry.delete(key);
    animateExitTo(el, boardZones[player].counts, 0.3);
  }

  function mergeInto(fromKey, unitKey) {
    if (!fromKey) return;
    const el = boardNodeRegistry.get(fromKey);
    if (!el) return;
    boardNodeRegistry.delete(fromKey);
    animateExitTo(el, boardNodeRegistry.get(unitKey) || null, 0.2);
  }

  // Computes and applies this step's one cross-zone identity change (if any) BEFORE the zones are
  // reconciled, so reconcileZone finds the right element already sitting under its new key. Derives
  // "which specific hand/Shield element this event is about" by diffing prevSnapshot vs snapshot's
  // hand list rather than trusting the event's own card number alone, since duplicate copies of a
  // card can coexist in hand -- exactly one entry ever vanishes per event, so whichever key that is
  // is unambiguous.
  function applyKeyTransition(prevSnapshot, snapshot, event) {
    if (!event || event.player === undefined) return;
    const p = event.player;
    switch (event.type) {
      case 'deploy':
        rekey(findVanishedKey(prevSnapshot.players[p].hand, snapshot.players[p].hand), 'unit-' + event.unit.id);
        break;
      case 'deployBase': {
        let fromKey = findVanishedKey(prevSnapshot.players[p].hand, snapshot.players[p].hand);
        // Not played from hand -> must be a Shield's Burst becoming a Base (becomeBase), parked under
        // this short-lived key by the 'burst' case below at the moment it was revealed.
        if (!fromKey && boardNodeRegistry.has('pendingReveal-' + p)) fromKey = 'pendingReveal-' + p;
        rekey(fromKey, 'unit-' + event.unit.id);
        break;
      }
      case 'command':
      case 'discard':
        exitToward(findVanishedKey(prevSnapshot.players[p].hand, snapshot.players[p].hand), p);
        break;
      case 'pair':
        mergeInto(findVanishedKey(prevSnapshot.players[p].hand, snapshot.players[p].hand), 'unit-' + event.unit.id);
        break;
      // pairFromTrash has no on-screen origin to animate from -- the trash is count-only.
      case 'destroy':
        exitToward('unit-' + event.unit.id, p);
        break;
      case 'burst': {
        const slotIdx = prevSnapshot.players[p].shieldCount - 1;
        const fromKey = 'shieldback-' + p + '-' + slotIdx;
        const el = boardNodeRegistry.get(fromKey);
        if (!el) break;
        boardNodeRegistry.delete(fromKey);
        // Swap the back for the real front art and play a quick squeeze -- a lightweight stand-in for
        // a true two-sided 3D flip, cheap and framework-free, still reads as "this Shield is revealed."
        el.dataset.role = 'shieldFront';
        el.className = 'shieldFront shieldFlip';
        el.innerHTML = `<img src="${imgSrcFor(event.card.number)}" onerror="this.style.visibility='hidden'" />`;
        wireHoverZoom(el.querySelector('img'), event.card.number);
        el.addEventListener('animationend', () => el.classList.remove('shieldFlip'), { once: true });
        if (event.endedUpInHand) {
          const hand = snapshot.players[p].hand;
          boardNodeRegistry.set(hand[hand.length - 1]._key, el);
        } else {
          const def = cardByNumber(event.card.number);
          if (def && def.type === 'base') {
            // becomeBase always follows (possibly a few events later, if the Base's own Deploy
            // ability fires other traceable effects first) -- 'pendingReveal-' keys are exempt from
            // the generic departed-entity cleanup below, so this waits safely until then.
            boardNodeRegistry.set('pendingReveal-' + p, el);
          } else {
            setTimeout(() => animateExitTo(el, boardZones[p].counts, 0.3), 160);
          }
        }
        break;
      }
    }
  }

  function flashClass(el, cls) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth; // restart the animation even if this exact class never finished clearing
    el.classList.add(cls);
    el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
  }

  function applyFlashes(event) {
    if (!event) return;
    switch (event.type) {
      case 'attack':
        flashClass(boardNodeRegistry.get('unit-' + event.attacker.id), 'flashAttack');
        if (event.target.type === 'unit') flashClass(boardNodeRegistry.get('unit-' + event.target.unit.id), 'flashHit');
        break;
      case 'block':
        flashClass(boardNodeRegistry.get('unit-' + event.blocker.id), 'flashBlock');
        break;
      case 'damage':
        flashClass(boardNodeRegistry.get('unit-' + event.instance.id), 'flashHit');
        break;
    }
  }

  // The FLIP payoff: given an element's rect from before this step's DOM mutations, work out how far
  // it moved/resized and animate it from there back to identity, so a re-parented or reordered element
  // glides to its new spot instead of jumping there instantly.
  function flipFrom(el, beforeRect) {
    const after = el.getBoundingClientRect();
    const dx = beforeRect.left - after.left;
    const dy = beforeRect.top - after.top;
    const sx = beforeRect.width / (after.width || 1);
    const sy = beforeRect.height / (after.height || 1);
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sx - 1) < 0.02 && Math.abs(sy - 1) < 0.02) return;
    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
    requestAnimationFrame(() => {
      el.style.transition = 'transform 380ms ease';
      el.style.transform = '';
      // Hands the transition property back to the stylesheet afterward, so this element's other,
      // ordinary CSS transitions (rested-state opacity, HP bar width) keep working on later steps.
      setTimeout(() => { el.style.transition = ''; }, 400);
    });
  }

  async function renderBoard(prevSnapshot, snapshot, animate) {
    await ensureCardsLoaded();
    ensureBoardSkeleton();

    let beforeRects = null;
    if (animate) {
      beforeRects = new Map();
      for (const el of boardNodeRegistry.values()) beforeRects.set(el, el.getBoundingClientRect());
      applyKeyTransition(prevSnapshot, snapshot, snapshot.event);
    }

    const seenAll = new Set();
    snapshot.players.forEach((p, i) => {
      const zone = boardZones[i];
      zone.root.classList.toggle('active', snapshot.activePlayer === i);
      zone.label.textContent = `Player ${i}${snapshot.activePlayer === i ? ' (active)' : ''}`;
      zone.counts.textContent = `Resources: ${p.resourceCount} · Trash: ${p.trashCount}`;

      const shieldItems = Array.from({ length: p.shieldCount }, (_, slot) => ({ _key: `shieldback-${i}-${slot}` }));
      for (const k of reconcileZone(zone.shieldsEl, shieldItems, 'shieldBack', null, animate)) seenAll.add(k);
      for (const k of reconcileZone(zone.baseEl, p.base ? [p.base] : [], 'unit', (u) => cardByNumber(u.number), animate)) seenAll.add(k);
      for (const k of reconcileZone(zone.battleEl, p.battleArea, 'unit', (u) => cardByNumber(u.number), animate)) seenAll.add(k);
      for (const k of reconcileZone(zone.handEl, p.hand, 'hand', null, animate)) seenAll.add(k);
    });

    // Anything still registered but not claimed by any zone above departed this step without one of
    // applyKeyTransition's own explicit handlers already having removed and animated it (e.g. a stray
    // edge case) -- give it a generic fade/shrink instead of silently vanishing. 'pendingReveal-'
    // entries are a deliberate exception: parked mid-flight between a Burst reveal and the becomeBase
    // event that will claim them, not actually abandoned.
    for (const [key, el] of [...boardNodeRegistry.entries()]) {
      if (seenAll.has(key) || key.indexOf('pendingReveal-') === 0) continue;
      boardNodeRegistry.delete(key);
      if (animate) { el.classList.add('exitAnim'); setTimeout(() => el.remove(), 400); }
      else el.remove();
    }

    if (animate && beforeRects) {
      for (const el of boardNodeRegistry.values()) {
        const before = beforeRects.get(el);
        if (before) flipFrom(el, before);
      }
      applyFlashes(snapshot.event);
    }
  }

  // --- Board View playback: Prev/Next/scrubber + a step-through auto-play. Only advancing exactly
  // one event forward (Next, or Play's own tick) triggers the FLIP/move animations above -- jumping
  // via Prev or the scrubber has no sensible "previous DOM state" to animate from, so those do a
  // plain instant rebuild instead (see replayLastRenderedIndex below).
  let currentReplayEvents = null;
  let currentReplayIndex = 0;
  let replayLastRenderedIndex = null;
  let playbackTimer = null;
  let replayViewMode = 'log';

  const logViewBtn = document.getElementById('logViewBtn');
  const boardViewBtn = document.getElementById('boardViewBtn');
  const replayBoardEl = document.getElementById('replayBoard');
  const eventCaptionEl = document.getElementById('eventCaption');
  const playbackScrub = document.getElementById('playbackScrub');
  const playbackPrev = document.getElementById('playbackPrev');
  const playbackNext = document.getElementById('playbackNext');
  const playbackPlay = document.getElementById('playbackPlay');

  function stopPlayback() {
    if (playbackTimer) {
      clearInterval(playbackTimer);
      playbackTimer = null;
      playbackPlay.textContent = 'Play';
    }
  }

  async function renderCurrentBoardStep() {
    if (!currentReplayEvents) return;
    // buildSnapshot now looks up card types (via cardByNumber) to resolve Burst-into-Base fates
    // correctly, so the card DB must be loaded before it runs, not just before renderBoard draws.
    await ensureCardsLoaded();
    const idx = currentReplayIndex;
    const animate = replayLastRenderedIndex !== null && idx === replayLastRenderedIndex + 1;
    if (!animate) resetBoard();
    const snapshot = buildSnapshot(currentReplayEvents, idx);
    const prevSnapshot = animate ? buildSnapshot(currentReplayEvents, idx - 1) : null;
    await renderBoard(prevSnapshot, snapshot, animate);
    replayLastRenderedIndex = idx;
    eventCaptionEl.textContent = `Event ${idx + 1} / ${currentReplayEvents.length} — ${eventCaptionText(snapshot.event)}`;
    playbackScrub.value = String(idx);
  }

  function setReplayView(mode) {
    replayViewMode = mode;
    logViewBtn.classList.toggle('active', mode === 'log');
    boardViewBtn.classList.toggle('active', mode === 'board');
    replayTimeline.style.display = mode === 'log' ? 'block' : 'none';
    replayBoardEl.style.display = mode === 'board' ? 'flex' : 'none';
    if (mode === 'board') renderCurrentBoardStep();
    else stopPlayback();
  }
  logViewBtn.addEventListener('click', () => setReplayView('log'));
  boardViewBtn.addEventListener('click', () => setReplayView('board'));

  playbackPrev.addEventListener('click', () => {
    stopPlayback();
    currentReplayIndex = Math.max(0, currentReplayIndex - 1);
    renderCurrentBoardStep();
  });
  playbackNext.addEventListener('click', () => {
    stopPlayback();
    currentReplayIndex = Math.min(currentReplayEvents.length - 1, currentReplayIndex + 1);
    renderCurrentBoardStep();
  });
  playbackScrub.addEventListener('input', () => {
    stopPlayback();
    currentReplayIndex = Number(playbackScrub.value);
    renderCurrentBoardStep();
  });
  playbackPlay.addEventListener('click', () => {
    if (playbackTimer) { stopPlayback(); return; }
    playbackPlay.textContent = 'Pause';
    // 900ms/step (was 700ms before motion existed) -- gives the longest animation chain (a Burst's
    // flip-then-fly-to-trash, ~540ms) room to finish before the next step's mutations start.
    playbackTimer = setInterval(() => {
      if (currentReplayIndex >= currentReplayEvents.length - 1) { stopPlayback(); return; }
      currentReplayIndex++;
      renderCurrentBoardStep();
    }, 900);
  });

  // Replaces the old "type a game number, click View Replay" flow -- games are now picked by
  // clicking a row in a saved batch's expanded game list on the Log page (see renderBatchList
  // below), which already has the exact seed + that batch's own context on hand.
  async function viewReplay(seed, context) {
    replaySection.style.display = 'flex';
    replayHintEl.style.display = 'none';
    stopPlayback();
    currentReplayEvents = null;
    replayTimeline.innerHTML = 'Loading replay...';
    try {
      const events = await window.sim.replayGame(seed, context);
      renderTimeline(events);
