      currentReplayEvents = events;
      currentReplayIndex = 0;
      // A fresh replay's instance ids start over from a fresh worker (see traceGame.js's own header
      // comment) -- they are NOT unique across two different replayGame() calls, so any stale
      // 'unit-<id>' entries from a previously-loaded game must not survive into this one.
      replayLastRenderedIndex = null;
      resetBoard();
      playbackScrub.max = String(Math.max(0, events.length - 1));
      playbackScrub.value = '0';
      if (replayViewMode === 'board') renderCurrentBoardStep();
    } catch (err) {
      replayTimeline.innerHTML = '<p style="color:var(--red-glow)">' + err.message + '</p>';
    }
  }

  // --- Nav: Simulate / Deck Builder / Saved Decks / Log ---
  const navSimulate = document.getElementById('navSimulate');
  const navBuilder = document.getElementById('navBuilder');
  const navDecks = document.getElementById('navDecks');
  const navLog = document.getElementById('navLog');
  const simulateScreen = document.getElementById('simulateScreen');
  const builderScreen = document.getElementById('builderScreen');
  const decksScreen = document.getElementById('decksScreen');
  const logScreen = document.getElementById('logScreen');

  function showScreen(which) {
    simulateScreen.classList.toggle('hidden', which !== 'simulate');
    builderScreen.classList.toggle('hidden', which !== 'builder');
    decksScreen.classList.toggle('hidden', which !== 'decks');
    logScreen.classList.toggle('hidden', which !== 'log');
    navSimulate.classList.toggle('active', which === 'simulate');
    navBuilder.classList.toggle('active', which === 'builder');
    navDecks.classList.toggle('active', which === 'decks');
    navLog.classList.toggle('active', which === 'log');
  }
  navSimulate.addEventListener('click', () => showScreen('simulate'));
  navDecks.addEventListener('click', () => {
    showScreen('decks');
    refreshSavedDecks();
  });
  navBuilder.addEventListener('click', () => {
    showScreen('builder');
    initBuilderOnce();
  });
  navLog.addEventListener('click', () => {
    showScreen('log');
    refreshSavedBatches();
  });

  // --- Deck Builder ---
  let allCards = [];
  const deckQty = new Map(); // card number -> quantity
  const cardSearch = document.getElementById('cardSearch');
  const filterColor = document.getElementById('filterColor');
  const filterLevel = document.getElementById('filterLevel');
  const filterCost = document.getElementById('filterCost');
  const cardGrid = document.getElementById('cardGrid');
  const deckListEl = document.getElementById('deckList');
  const deckTotalEl = document.getElementById('deckTotal');
  const builderErrorsEl = document.getElementById('builderErrors');
  const savedBuilderSelect = document.getElementById('savedBuilder');
  const savedDeckListEl = document.getElementById('savedDeckList');
  const MAX_RENDERED_CARDS = 60;

  // Idempotent/cached via a shared promise -- both the Deck Builder nav (which also needs to
  // populate the filter dropdowns, once) and the Deck A/B export buttons (which just need card
  // names/art, and may run before the Deck Builder screen has ever been opened) call this.
  let cardsLoadPromise = null;
  function ensureCardsLoaded() {
    if (!cardsLoadPromise) {
      cardsLoadPromise = window.cards
        ? window.cards.list().then((list) => { allCards = list; return list; })
        : Promise.resolve([]);
    }
    return cardsLoadPromise;
  }

  let filtersPopulated = false;
  async function initBuilderOnce() {
    await ensureCardsLoaded();
    if (filtersPopulated) return;
    filtersPopulated = true;
    const colors = [...new Set(allCards.map((c) => c.color).filter(Boolean))].sort();
    const levels = [...new Set(allCards.map((c) => c.level).filter((v) => v !== undefined && v !== null))].sort((a, b) => a - b);
    const costs = [...new Set(allCards.map((c) => c.cost).filter((v) => v !== undefined && v !== null))].sort((a, b) => a - b);
    for (const c of colors) filterColor.appendChild(new Option(c[0].toUpperCase() + c.slice(1), c));
    for (const l of levels) filterLevel.appendChild(new Option('Lv.' + l, l));
    for (const c of costs) filterCost.appendChild(new Option('Cost ' + c, c));
  }

  function cardByNumber(number) {
    return allCards.find((c) => c.number === number);
  }

  // Loading a saved deck into the builder replaces deckQty wholesale and re-renders it through the
  // same expanded card-art grid renderDeckList() already draws -- this is the "view a saved deck in
  // an expanded format" Jake asked for, distinct from the small Deck A/B dropdowns on the Simulate
  // screen (which just load raw text into a textarea).
  async function loadSavedDeckIntoBuilder(name) {
    if (!name || !window.deckStore || !window.cards) return;
    const deck = await window.deckStore.load(name);
    if (!deck) return;
    await ensureCardsLoaded();
    const result = await window.cards.validate(deck.decklistText);
    deckQty.clear();
    for (const entry of result.parsed) {
      deckQty.set(entry.number, (deckQty.get(entry.number) || 0) + entry.quantity);
    }
    builderDeckNameInput.value = deck.name;
    renderDeckList();
    renderCardGrid();
    validateBuilderDeck();
    builderStatusEl.textContent = `Loaded "${deck.name}".`;
  }

  savedBuilderSelect.addEventListener('change', () => loadSavedDeckIntoBuilder(savedBuilderSelect.value));

  // Card art ships inside the app at electron/renderer/assets/cards/{number}.webp (populated by
  // bin/download-images.js). A missing file just hides the <img> instead of showing a broken-image icon.
  function imgSrcFor(number) {
    return 'assets/cards/' + encodeURIComponent(number) + '.webp';
  }

  // Shared hover-zoom: both the Browse Cards grid and Your Deck grid wire their thumbnails to this
  // one fixed-position overlay, since the in-grid art is too small to actually read a card's text.
  const cardZoomEl = document.getElementById('cardZoom');
  const cardZoomImg = document.getElementById('cardZoomImg');

  function wireHoverZoom(imgEl, number) {
    imgEl.addEventListener('mouseenter', () => {
      cardZoomImg.src = imgSrcFor(number);
      cardZoomEl.style.display = 'block';
    });
    imgEl.addEventListener('mousemove', (ev) => {
      const zoomW = cardZoomEl.offsetWidth || 300;
      const zoomH = cardZoomEl.offsetHeight || 419;
      let x = ev.clientX + 24;
      let y = ev.clientY + 24;
      if (x + zoomW > window.innerWidth) x = ev.clientX - zoomW - 24;
      if (y + zoomH > window.innerHeight) y = ev.clientY - zoomH - 24;
      cardZoomEl.style.left = Math.max(0, x) + 'px';
      cardZoomEl.style.top = Math.max(0, y) + 'px';
    });
    imgEl.addEventListener('mouseleave', () => {
      cardZoomEl.style.display = 'none';
    });
  }

  function cardTileHtml(c) {
    const qty = deckQty.get(c.number) || 0;
    return `
      <div class="cardTile" data-number="${c.number}">
        <img src="${imgSrcFor(c.number)}" onerror="this.style.display='none'" />
        <div class="name">${c.name}</div>
        <div class="meta">${c.number} — ${c.color || ''} Lv.${c.level ?? '-'} Cost ${c.cost ?? '-'}</div>
        <div class="qtyRow">
          <button class="qtyMinus" type="button">-</button>
          <span class="qty">${qty}</span>
          <button class="qtyPlus" type="button">+</button>
        </div>
      </div>`;
  }

  function adjustQty(number, delta) {
    const next = Math.max(0, (deckQty.get(number) || 0) + delta);
    if (next === 0) deckQty.delete(number);
    else deckQty.set(number, next);
    renderCardGrid();
    renderDeckList();
    validateBuilderDeck();
  }

  function renderCardGrid() {
    const term = cardSearch.value.trim().toLowerCase();
    const color = filterColor.value;
    const level = filterLevel.value;
    const cost = filterCost.value;
    if (!term && !color && !level && !cost) {
      cardGrid.innerHTML = '<p class="hint">Type a search term or pick a filter to browse the card database.</p>';
      return;
    }
    const matches = allCards.filter((c) => {
      if (term && !(c.name.toLowerCase().includes(term) || c.number.toLowerCase().includes(term))) return false;
      if (color && c.color !== color) return false;
      if (level && String(c.level) !== level) return false;
      if (cost && String(c.cost) !== cost) return false;
      return true;
    });
    const shown = matches.slice(0, MAX_RENDERED_CARDS);
    cardGrid.innerHTML =
      shown.map(cardTileHtml).join('') +
      (matches.length > MAX_RENDERED_CARDS
        ? `<p class="hint">...and ${matches.length - MAX_RENDERED_CARDS} more — narrow your search.</p>`
        : '');
    for (const el of cardGrid.querySelectorAll('.cardTile')) {
      const number = el.dataset.number;
      el.querySelector('.qtyPlus').addEventListener('click', () => adjustQty(number, 1));
      el.querySelector('.qtyMinus').addEventListener('click', () => adjustQty(number, -1));
      wireHoverZoom(el.querySelector('img'), number);
    }
  }

  function buildDecklistText() {
    return [...deckQty.entries()].map(([number, qty]) => `${qty} ${number}`).join('\n');
  }

  function renderDeckList() {
    let total = 0;
    const rows = [];
    for (const [number, qty] of deckQty) {
      total += qty;
      const c = cardByNumber(number);
      rows.push(`
        <div class="deckEntry" data-number="${number}">
          <img src="${imgSrcFor(number)}" onerror="this.style.display='none'" />
          <span class="entryName">${c ? c.name : number}</span>
          <span class="entryQty">${number}</span>
          <div class="qtyRow">
            <button class="qtyMinus" type="button" title="Remove one">-</button>
            <span class="qty">${qty}</span>
            <button class="qtyPlus" type="button" title="Add one">+</button>
            <button class="entryRemove" type="button" title="Remove all copies">&times;</button>
          </div>
        </div>`);
    }
    deckTotalEl.textContent = `${total} / 50 cards`;
    deckListEl.innerHTML = rows.join('') || '<p class="hint">No cards added yet.</p>';
    for (const el of deckListEl.querySelectorAll('.deckEntry')) {
      const number = el.dataset.number;
      el.querySelector('.qtyPlus').addEventListener('click', () => adjustQty(number, 1));
      el.querySelector('.qtyMinus').addEventListener('click', () => adjustQty(number, -1));
      el.querySelector('.entryRemove').addEventListener('click', () => {
        deckQty.delete(number);
        renderDeckList();
        renderCardGrid();
        validateBuilderDeck();
      });
      wireHoverZoom(el.querySelector('img'), number);
    }
  }

  async function validateBuilderDeck() {
    if (!window.cards) return;
    const text = buildDecklistText();
    if (!text) {
      builderErrorsEl.textContent = '';
      return;
    }
    const result = await window.cards.validate(text);
    builderErrorsEl.textContent = result.errors.join('\n');
  }

  cardSearch.addEventListener('input', renderCardGrid);
  filterColor.addEventListener('change', renderCardGrid);
  filterLevel.addEventListener('change', renderCardGrid);
  filterCost.addEventListener('change', renderCardGrid);

  document.getElementById('importBtn').addEventListener('click', async () => {
    const text = document.getElementById('importText').value;
    if (!text.trim() || !window.cards) return;
    const result = await window.cards.validate(text);
    for (const entry of result.parsed) {
      deckQty.set(entry.number, (deckQty.get(entry.number) || 0) + entry.quantity);
    }
    renderDeckList();
    renderCardGrid();
    validateBuilderDeck();
  });

  const builderStatusEl = document.getElementById('builderStatus');
  const builderDeckNameInput = document.getElementById('builderDeckName');

  document.getElementById('saveBuilderBtn').addEventListener('click', async () => {
    const name = builderDeckNameInput.value.trim();
    if (!name) { builderDeckNameInput.focus(); return; }
    if (!window.deckStore) return;
    await window.deckStore.save(name, buildDecklistText());
    refreshSavedDecks();
    builderStatusEl.textContent = `Saved "${name}".`;
  });

  document.getElementById('clearBuilderBtn').addEventListener('click', () => {
    deckQty.clear();
    renderDeckList();
    renderCardGrid();
    builderDeckNameInput.value = '';
    document.getElementById('importText').value = '';
    builderErrorsEl.textContent = '';
    builderStatusEl.textContent = '';
  });

  // --- Export: deck card-collage images + the stats infographic ---
  function loadCardImage(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    let curY = y;
    for (const word of words) {
      const test = line + word + ' ';
      if (line && ctx.measureText(test).width > maxWidth) {
        ctx.fillText(line, x, curY);
        line = word + ' ';
        curY += lineHeight;
      } else {
        line = test;
      }
    }
    ctx.fillText(line, x, curY);
  }

  async function groupedEntriesFromText(text) {
    await ensureCardsLoaded();
    if (!text.trim() || !window.cards) return [];
    const result = await window.cards.validate(text);
    const byNumber = new Map();
    for (const entry of result.parsed) {
      byNumber.set(entry.number, (byNumber.get(entry.number) || 0) + entry.quantity);
    }
    return [...byNumber.entries()].map(([number, qty]) => {
      const c = cardByNumber(number);
      return { number, qty, name: c ? c.name : number };
    });
  }

  function groupedEntriesFromMap(map) {
    return [...map.entries()].map(([number, qty]) => {
      const c = cardByNumber(number);
      return { number, qty, name: c ? c.name : number };
    });
  }

  // Source card art is 600x838 real pixels (bin/download-images.js pulls the "-640w.webp" scan) --
  // the old 140x196 export size threw away almost all of that detail, which is why Jake couldn't
  // read any card text in the exported PNGs. Sized close to source resolution instead (aspect ratio
  // preserved exactly: 838/600) so the export is actually legible when viewed/zoomed.
  const DECK_IMG_CARD_W = 300;
  const DECK_IMG_CARD_H = Math.round((300 * 838) / 600);
  const DECK_IMG_GAP = 16;
  const DECK_IMG_COLS = 5;

  // Draws one card cell: real art if it loaded, otherwise a name/number placeholder box so a card
  // is never silently dropped just because its art file is missing. For qty > 1, a bold "xN" bar
  // spans the bottom of the card -- modeled directly on the reference deck-export image Jake shared
  // (ExBurst.dev's deckbuilder export), not a generic corner badge.
  function drawCardCell(ctx, x, y, w, h, img, entry) {
    if (img) {
      ctx.drawImage(img, x, y, w, h);
    } else {
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#444';
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = '#ccc';
      ctx.font = Math.round(h * 0.06) + 'px "Segoe UI", Arial, sans-serif';
      wrapText(ctx, entry.name, x + 8, y + h * 0.13, w - 16, h * 0.08);
      ctx.fillStyle = '#777';
      ctx.font = Math.round(h * 0.05) + 'px "Segoe UI", Arial, sans-serif';
      ctx.fillText(entry.number, x + 8, y + h - 10);
    }
    if (entry.qty > 1) {
      const badgeH = Math.max(20, h * 0.16);
      const by = y + h - badgeH;
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(x, by, w, badgeH);
      ctx.strokeStyle = '#9B1B1E';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, by, w, badgeH);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + Math.round(badgeH * 0.6) + 'px "Segoe UI", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('x' + entry.qty, x + w / 2, by + badgeH * 0.72);
      ctx.textAlign = 'left';
    }
  }

  // One picture per unique card, laid out in a grid -- per Jake's request for a shareable deck poster.
  async function composeDeckImageCanvas(entries, title) {
    const images = await Promise.all(entries.map((e) => loadCardImage(imgSrcFor(e.number))));
    const cols = Math.max(1, Math.min(DECK_IMG_COLS, entries.length));
    const rows = Math.max(1, Math.ceil(entries.length / cols));
    const headerH = 70;
    const w = cols * DECK_IMG_CARD_W + (cols + 1) * DECK_IMG_GAP;
    const h = headerH + rows * DECK_IMG_CARD_H + (rows + 1) * DECK_IMG_GAP;

    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#9B1B1E';
    ctx.fillRect(0, 0, w, 5);
    ctx.fillStyle = '#C9A951';
    ctx.font = 'bold 26px "Bahnschrift", "Arial Narrow", Impact, sans-serif';
    ctx.fillText(title, 18, 40);
    const totalCount = entries.reduce((sum, e) => sum + e.qty, 0);
    ctx.fillStyle = '#999';
    ctx.font = '13px "Segoe UI", Arial, sans-serif';
    ctx.fillText(`${entries.length} unique card${entries.length === 1 ? '' : 's'}, ${totalCount} total`, 18, 58);

    entries.forEach((e, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = DECK_IMG_GAP + col * (DECK_IMG_CARD_W + DECK_IMG_GAP);
      const y = headerH + DECK_IMG_GAP + row * (DECK_IMG_CARD_H + DECK_IMG_GAP);
      drawCardCell(ctx, x, y, DECK_IMG_CARD_W, DECK_IMG_CARD_H, images[i], e);
    });

    return canvas;
  }

  // Draws a labeled grid of card cells starting at (startX, startY) and returns the y-coordinate
  // just below it, so callers can stack sections vertically without pre-computing every height by
  // hand. Shared by the stats infographic's per-deck visual list sections below.
  function drawDeckGridSection(ctx, entries, images, startX, startY, cols, cardW, cardH, gap, label) {
    ctx.fillStyle = '#C9A951';
    ctx.font = 'bold 18px "Bahnschrift", "Arial Narrow", Impact, sans-serif';
    ctx.fillText(label, startX, startY);
    const gridTop = startY + 14;
    entries.forEach((e, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = startX + col * (cardW + gap);
      const y = gridTop + row * (cardH + gap);
      drawCardCell(ctx, x, y, cardW, cardH, images[i], e);
    });
    const rows = Math.max(1, Math.ceil(entries.length / cols));
    return gridTop + rows * (cardH + gap);
  }

  // A standalone matchup-report image reusing the exact same drawBarChart function the on-screen
  // chart uses (drawn to an offscreen canvas, then composited in), so the export can never drift
  // from what's actually shown on screen.
  // Same resolution reasoning as DECK_IMG_CARD_W above -- sized for legibility, not a small summary
  // thumbnail. REPORT_W grows with it (5 cols at this size, computed below) rather than squeezing a
  // fixed page width.
  const REPORT_DECK_CARD_W = 220;
  const REPORT_DECK_CARD_H = Math.round((220 * 838) / 600);
  const REPORT_DECK_GAP = 16;
  const REPORT_MARGIN = 24;
  const REPORT_COLS = 5;
  const REPORT_W = REPORT_COLS * REPORT_DECK_CARD_W + (REPORT_COLS - 1) * REPORT_DECK_GAP + 2 * REPORT_MARGIN;

  // Includes a visual deck list per side (real card art + qty badges, same look as the standalone
  // deck-image export) below the usual stats -- per Jake's request, modeled on the reference
  // deckbuilder-export image he shared. Height is computed from however many unique cards each deck
  // actually has, not a fixed guess, since that varies deck to deck.
  async function composeStatsInfographicCanvas(stats, titleA, titleB, entriesA, entriesB) {
    const chartCanvas = document.createElement('canvas');
    chartCanvas.width = 620;
    chartCanvas.height = 460;
    drawBarChart(chartCanvas, CHART_GROUPS(stats), 13);

    const cols = REPORT_COLS; // REPORT_W above is derived from this, not the other way around
    const [imagesA, imagesB] = await Promise.all([
      Promise.all(entriesA.map((e) => loadCardImage(imgSrcFor(e.number)))),
      Promise.all(entriesB.map((e) => loadCardImage(imgSrcFor(e.number))))
    ]);

    const statsBlockBottom = 730; // header + callouts + secondary callouts + taller chart, fixed layout below
    const deckSectionH = (entries) => {
      const rows = Math.max(1, Math.ceil(entries.length / cols));
      return 14 + 24 + rows * (REPORT_DECK_CARD_H + REPORT_DECK_GAP);
    };
    const deckASectionTop = statsBlockBottom + 10;
    const deckBSectionTop = deckASectionTop + deckSectionH(entriesA) + 20;
    const h = deckBSectionTop + deckSectionH(entriesB) + 40;

    const canvas = document.createElement('canvas');
    canvas.width = REPORT_W;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, REPORT_W, h);
    ctx.fillStyle = '#9B1B1E';
    ctx.fillRect(0, 0, REPORT_W, 6);

    ctx.fillStyle = '#C9A951';
    ctx.font = 'bold 28px "Bahnschrift", "Arial Narrow", Impact, sans-serif';
    ctx.fillText('GUNDAM TCG SIM — MATCHUP REPORT', 24, 46);
    ctx.fillStyle = '#999';
    ctx.font = '13px "Segoe UI", Arial, sans-serif';
    ctx.fillText(`${titleA} vs ${titleB}  |  ${stats.games} games  |  ${new Date().toLocaleString()}`, 24, 66);

    const callouts = [
      [pct(stats.deckA.winRate), 'DECK A WIN RATE'],
      [pct(stats.deckB.winRate), 'DECK B WIN RATE'],
      [stats.averageTurns.toFixed(1), 'AVG TURNS']
    ];
    const calloutW = (REPORT_W - 48 - 32) / 3;
    callouts.forEach(([num, lbl], i) => {
      const x = 24 + i * (calloutW + 16);
      ctx.strokeStyle = '#333';
      ctx.strokeRect(x, 86, calloutW, 78);
      ctx.fillStyle = '#C9A951';
      ctx.textAlign = 'center';
      ctx.font = 'bold 32px "Bahnschrift", "Arial Narrow", Impact, sans-serif';
      ctx.fillText(num, x + calloutW / 2, 134);
      ctx.fillStyle = '#999';
      ctx.font = '11px "Segoe UI", Arial, sans-serif';
      ctx.fillText(lbl, x + calloutW / 2, 154);
      ctx.textAlign = 'left';
    });

    // Secondary row -- same counts/game-length tiles as the on-screen `.callouts.secondary` row,
    // kept as small visual tiles here too instead of a text sentence.
    const secondary = [
      [stats.games, 'GAMES'], [stats.draws, 'DRAWS'], [stats.timeouts, 'TIMEOUTS'],
      [stats.shortestGame, 'SHORTEST'], [stats.medianGame, 'MEDIAN'], [stats.longestGame, 'LONGEST']
    ];
    const secW = (REPORT_W - 48 - 5 * 12) / 6;
    secondary.forEach(([num, lbl], i) => {
      const x = 24 + i * (secW + 12);
      ctx.strokeStyle = '#2a2a2a';
      ctx.strokeRect(x, 178, secW, 54);
      ctx.fillStyle = '#C9A951';
      ctx.textAlign = 'center';
      ctx.font = 'bold 18px "Bahnschrift", "Arial Narrow", Impact, sans-serif';
      ctx.fillText(String(num), x + secW / 2, 206);
      ctx.fillStyle = '#999';
      ctx.font = '9px "Segoe UI", Arial, sans-serif';
      ctx.fillText(lbl, x + secW / 2, 222);
      ctx.textAlign = 'left';
    });

    ctx.drawImage(chartCanvas, 24, 250, REPORT_W - 48, 460);

    drawDeckGridSection(
      ctx, entriesA, imagesA, 24, deckASectionTop, cols, REPORT_DECK_CARD_W, REPORT_DECK_CARD_H, REPORT_DECK_GAP,
      `${titleA} — Deck List (${entriesA.length} unique, ${entriesA.reduce((s, e) => s + e.qty, 0)} total)`
    );
    drawDeckGridSection(
      ctx, entriesB, imagesB, 24, deckBSectionTop, cols, REPORT_DECK_CARD_W, REPORT_DECK_CARD_H, REPORT_DECK_GAP,
      `${titleB} — Deck List (${entriesB.length} unique, ${entriesB.reduce((s, e) => s + e.qty, 0)} total)`
    );

    ctx.fillStyle = '#666';
    ctx.font = '11px "Segoe UI", Arial, sans-serif';
    ctx.fillText('Generated by Gundam TCG Sim', 24, h - 16);

    return canvas;
  }

  async function saveCanvasAsImage(canvas, suggestedName, statusEl) {
    if (!window.exporter) {
      statusEl.textContent = 'Export is not available.';
      return;
    }
    statusEl.textContent = 'Saving...';
    try {
      const dataUrl = canvas.toDataURL('image/png');
      const result = await window.exporter.saveImage(dataUrl, suggestedName);
      statusEl.textContent = result.saved ? `Saved to ${result.filePath}` : 'Export cancelled.';
    } catch (err) {
      statusEl.textContent = 'Export failed: ' + err.message;
    }
  }

  document.getElementById('exportA').addEventListener('click', async () => {
    const statusEl = document.getElementById('statusA');
    statusEl.textContent = 'Preparing image...';
    const entries = await groupedEntriesFromText(document.getElementById('deckA').value);
    if (!entries.length) { statusEl.textContent = 'Nothing to export — paste or load a deck first.'; return; }
    const title = nameAInput.value.trim() || 'Deck A';
    const canvas = await composeDeckImageCanvas(entries, title);
    await saveCanvasAsImage(canvas, title.replace(/[^a-z0-9]+/gi, '-') + '.png', statusEl);
  });

  document.getElementById('exportB').addEventListener('click', async () => {
    const statusEl = document.getElementById('statusB');
    statusEl.textContent = 'Preparing image...';
    const entries = await groupedEntriesFromText(document.getElementById('deckB').value);
    if (!entries.length) { statusEl.textContent = 'Nothing to export — paste or load a deck first.'; return; }
    const title = nameBInput.value.trim() || 'Deck B';
    const canvas = await composeDeckImageCanvas(entries, title);
    await saveCanvasAsImage(canvas, title.replace(/[^a-z0-9]+/gi, '-') + '.png', statusEl);
  });

  document.getElementById('exportBuilderBtn').addEventListener('click', async () => {
    await ensureCardsLoaded();
    if (deckQty.size === 0) { builderStatusEl.textContent = 'Nothing to export — add some cards first.'; return; }
    const title = builderDeckNameInput.value.trim() || 'My Deck';
    const entries = groupedEntriesFromMap(deckQty);
    builderStatusEl.textContent = 'Preparing image...';
    const canvas = await composeDeckImageCanvas(entries, title);
    await saveCanvasAsImage(canvas, title.replace(/[^a-z0-9]+/gi, '-') + '.png', builderStatusEl);
  });

  exportStatsBtn.addEventListener('click', async () => {
    if (!lastStats) return;
    exportStatusEl.textContent = 'Preparing infographic...';
    const titleA = nameAInput.value.trim() || 'Deck A';
    const titleB = nameBInput.value.trim() || 'Deck B';
    // Uses whatever is currently pasted/loaded in the Deck A/B textareas to build the visual deck
    // lists -- same assumption the standalone per-deck "Export Image" buttons already make (lastStats
    // doesn't carry the decklists themselves, just results; lastContext does, but only its
    // engine/mctsConfig are relevant here since the textareas already have the actual deck text).
    const entriesA = await groupedEntriesFromText(document.getElementById('deckA').value);
    const entriesB = await groupedEntriesFromText(document.getElementById('deckB').value);
    const canvas = await composeStatsInfographicCanvas(lastStats, titleA, titleB, entriesA, entriesB);
    await saveCanvasAsImage(canvas, 'matchup-report.png', exportStatusEl);
  });

  // Populated last and defensively: everything above (buttons, progress, results, error wiring)
  // must keep working even if this throws -- a preload-side failure to expose skillPresets
  // shouldn't be able to silently kill the whole page's event handlers again (see main.js's
  // sandbox:false comment for the bug this guards against).
  try {
    const presets = (window.sim && window.sim.skillPresets) || [];
    for (const select of [skillASelect, skillBSelect]) {
      for (const preset of presets) {
        const option = document.createElement('option');
        option.value = preset.id;
        option.textContent = preset.label;
        select.appendChild(option);
      }
      if (presets.some((p) => p.id === 'casual')) select.value = 'casual';
    }
  } catch (err) {
    errorEl.textContent = 'Skill presets failed to load: ' + err.message;
  }

  try {
    refreshSavedDecks();
  } catch (err) {
    errorEl.textContent = 'Saved decks failed to load: ' + err.message;
  }

  // --- Update banner: main.js checks GitHub Releases a few seconds after launch (never blocking
  // startup, never silently downloading -- see main.js's autoUpdater comment). This just reflects
  // whatever stage main.js reports; errors (e.g. offline) are swallowed rather than shown, since a
  // failed background check isn't something the user needs to be bothered about.
  if (window.updater) {
    const updateBannerEl = document.getElementById('updateBanner');
    let updateStage = null;
    updateBannerEl.addEventListener('click', () => {
      if (updateStage === 'available') window.updater.download();
      else if (updateStage === 'downloaded') window.updater.quitAndInstall();
    });
    window.updater.onStatus((status) => {
      updateStage = status.status;
      if (status.status === 'available') {
        updateBannerEl.textContent = `Update available (v${status.version}) — click to download`;
        updateBannerEl.disabled = false;
        updateBannerEl.style.display = '';
      } else if (status.status === 'downloading') {
        updateBannerEl.textContent = `Downloading update... ${Math.round(status.percent)}%`;
        updateBannerEl.disabled = true;
        updateBannerEl.style.display = '';
      } else if (status.status === 'downloaded') {
        updateBannerEl.textContent = 'Update ready — click to restart & install';
        updateBannerEl.disabled = false;
        updateBannerEl.style.display = '';
      } else {
        updateBannerEl.style.display = 'none';
      }
    });
  }
</script>
</body>
</html>
